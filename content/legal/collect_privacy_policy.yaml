page:
  id: privacy
  title: Privacy Policy
  slug: /privacy
  seo:
    title: Privacy Policy | Collect by IKANISA
    description: Learn how Collect by IKANISA collects, uses, shares, protects, retains and deletes personal
      data.
  last_updated: 20 October 2026
  hero:
    eyebrow: PRIVACY AND TRUST
    headline: Your data. Your choice. Your financial journey.
    supporting_copy: Collect uses personal data to operate accounts, maintain group-contribution records,
      review contribution evidence, protect the service and respond to support requests.
    trust_statement: We do not sell your personal data.
  privacy_at_a_glance:
  - title: Account and group records
    copy: Member screens use Collect IDs. Sign-in numbers, MoMo details and raw receipt evidence are private.
  - title: Evidence has limits
    copy: A receipt or recorded contribution alone does not verify provider settlement. Authorised operators
      review attribution separately.
  - title: Planned services are unavailable
    copy: Credit readiness, lending, insurance, collateral and related professional-service handoffs are
      planned directions. They are not services available through the current Collect app. Do not send
      loan, insurance, identity-document or medical files for those services.
  - title: Ask about your data
    copy: Contact info@ikanisa.com to ask for access, correction, a copy or deletion. A request receipt
      does not mean data has been erased.
  - title: Collect does not hold funds
    copy: Members authorise MoMo payments with their provider. Collect keeps contribution records and
      does not hold customer funds.
  sections:
  - id: who-we-are
    heading: 1. Who we are
    body:
    - 'Collect is operated by:'
    details:
      legal_entity: IKANISA
      privacy_email: info@ikanisa.com
      support_email: info@ikanisa.com
    closing: For the personal data described in this Policy, IKANISA acts as the data controller unless
      another organisation is identified as the controller. A partner bank, insurer or professional service
      provider may act as a separate data controller for the products and services it provides.
  - id: scope
    heading: 2. What this Policy covers
    intro: 'This Policy applies when you:'
    bullets:
    - Visit the Collect website
    - Use an available Collect member or Admin application
    - Create or join a group where supported
    - Submit contribution evidence through an authorised, consented route
    - Manage authorised group, roster or reconciliation records
    - Contact Collect support
    closing: Credit readiness, lending, insurance, collateral and related professional-service handoffs
      are planned directions. They are not services available through the current Collect app. Do not
      send loan, insurance, identity-document or medical files for those services.
  - id: data-we-collect
    heading: 3. Personal data we may collect
    subsections:
    - heading: Member account and contact information
      bullets:
      - Numeric Collect ID and the phone number or email used to sign in
      - Google account identifier and verified email if you choose Google where enabled
      - Rwanda country and currency profile
      - MoMo provider, number and pay code
      - Account, session, verification and notification-preference records
      closing: The member app does not ask for or display personal names. Admin operator accounts and
        authorised Direct-member or receipt records may contain names and contact details.
    - heading: Group and contribution records
      bullets:
      - Group title, purpose, description and selected cover
      - Membership, role and invitation records
      - Contribution intents, amounts, currency and recorded status
      - Ledger entries, reconciliation decisions, reasons and signed correction or reversal records
      closing: Ledger totals are contribution records, not money held in a Collect account.
    - heading: Receipt and roster evidence
      bullets:
      - Raw receipt text and related payer, receiver, amount, reference and time facts
      - Source files and reviewed rows supplied through authorised roster imports
      - Consent, access, review and audit records
      closing: Raw evidence may contain personal names or telephone numbers. It is restricted to authorised
        operational access. Receipt evidence alone is not independent proof of settlement.
    - heading: Authentication and security information
      bullets:
      - Sign-in challenges, session identifiers and abuse-prevention signals
      - Email-code delivery and verification records; a sign-in code expiring does not delete these records
      - Google sign-in verification and account-linking records where enabled
      - Protected Admin password and authenticator records
      - Device or integrity-verification results where that capability is enabled
      closing: Collect does not ask for a MoMo PIN or payment-provider OTP. Your Collect sign-in code
        is for signing in to Collect.
    - heading: Technical and support information
      bullets:
      - App or browser version and relevant device information
      - Network, error, audit and security records
      - Information you provide in a support, correction or deletion request
    - heading: Planned services
      body: Credit readiness, lending, insurance, collateral and related professional-service handoffs
        are planned directions. They are not services available through the current Collect app. Do not
        send loan, insurance, identity-document or medical files for those services.
  - id: sources
    heading: 4. How we obtain personal data
    intro: 'We may obtain information:'
    bullets:
    - Directly from you
    - From an authorised group leader or operator handling group, receipt or roster evidence
    - From enabled authentication, hosting or communication services
    - From Google if you choose Google sign-in where enabled; Collect requests OpenID identity, email and basic profile access
    - From your device when an enabled feature requires it and applicable consent is provided
    closing: Where another person provides information about you, we may ask that person to confirm that
      they are authorised to do so.
  - id: uses
    heading: 5. How we use personal data
    intro: 'We use personal data to:'
    bullets:
    - Create and secure your account
    - Create, join and administer groups where supported
    - Record contribution intents and review evidence
    - Maintain contribution ledgers and reasoned reconciliation history
    - Manage available notification preferences and service channels
    - Prevent misuse and investigate security incidents
    - Handle support, correction, privacy and dispute requests
    - Meet applicable legal obligations
    closing: We do not use personal data for an unrelated purpose without an appropriate legal basis.
  - id: legal-bases
    heading: 6. Our legal bases
    intro: 'Depending on the service and your location, we process personal data because:'
    bullets:
    - It is necessary to provide the service you requested
    - You have given consent
    - We must comply with a legal or regulatory obligation
    - Processing is necessary to protect you, another person or the platform
    - We or a partner have a legitimate interest that does not override your rights
    - Processing is necessary to establish, exercise or defend a legal claim
    closing: You may withdraw consent where processing depends on consent. Withdrawal does not affect
      processing that was lawful before withdrawal.
  - id: sharing
    heading: 7. How information is shared
    subsections:
    - heading: Group visibility
      body: Member screens use Collect IDs and permitted contribution status. Detailed amounts are restricted
        by membership and owner permissions. Sign-in phones, MoMo details and raw receipt text are not
        public group-card or share-link content.
    - heading: Authorised operators
      body: Operators with the required permissions may review member, roster, receipt and reconciliation
        records for their assigned work. Sensitive actions require additional authentication and retained
        audit records.
    - heading: Technology and operational providers
      body: Supabase provides Collect authentication, database and private evidence storage. Cloudflare
        provides web hosting, API forwarding and security challenges. Records and recovery copies from
        the earlier Cloudflare backend may remain in retained systems or archives; changing providers
        does not erase them. Google provides identity verification if you choose Google sign-in where
        enabled. Other enabled communications or support providers receive only the information required
        for that service. Contact info@ikanisa.com for the applicable provider and processing details.
    - heading: Public authorities and legal claims
      body: Information may be disclosed where a specific legal obligation or lawful request requires
        it, or where needed to establish, exercise or defend a legal claim.
    - heading: Planned partner services
      body: Credit readiness, lending, insurance, collateral and related professional-service handoffs
        are planned directions. They are not services available through the current Collect app. Do not
        send loan, insurance, identity-document or medical files for those services.
  - id: international-transfers
    heading: 8. Data processing location
    body:
    - Collect serves Rwanda users. Cloudflare and other enabled service providers may process information
      outside Rwanda. This notice does not claim that all information is stored in Rwanda. Contact info@ikanisa.com
      for the applicable processing locations and transfer arrangements.
    subprocessor_link: /privacy/#sharing
  - id: ai
    heading: 9. AI and automated processing
    body: AI document extraction is not enabled for production without approved provider, processing,
      retention and human-review controls. Automated receipt parsing or a ledger record does not by itself
      authenticate provider settlement. Collect does not offer automated lending, insurance or eligibility
      decisions.
    closing: You may ask support to review inaccurate information or a disputed contribution record.
  - id: retention
    heading: 10. How long we retain information
    intro: 'We keep personal data only for as long as needed to:'
    bullets:
    - Operate the account and the requested group-record service
    - Maintain contribution and audit history where a justified retention basis applies
    - Prevent misuse and investigate security incidents
    - Handle requests, disputes and legal claims
    - Meet an identified applicable legal obligation
    closing: Retention depends on the record category, purpose and any applicable obligation or legal
      hold. Contact support for the period and basis applying to your records. Submitting a request is
      not confirmation that profiles, evidence, exports or secured backups have been erased. Check request
      status or contact support for the outcome and retained records.
  - id: rights
    heading: 11. Your privacy rights
    intro: 'Depending on applicable law, you may request to:'
    bullets:
    - Access personal data we hold about you
    - Receive a copy of your data
    - Correct inaccurate or incomplete information
    - Export data in a structured format
    - Object to certain processing
    - Restrict processing
    - Withdraw consent
    - Stop direct marketing
    - Request deletion
    - Challenge a decision based solely on automated processing
    - Ask who has received your data
    - Complain to a data-protection authority
    contact:
      email: info@ikanisa.com
      privacy_request: mailto:info@ikanisa.com?subject=Collect+privacy+request
    closing: We may need to verify your identity before completing a request.
  - id: account-and-data-deletion
    heading: 12. Account deletion and data deletion
    subsections:
    - heading: Delete your account in the Collect app
      steps:
      - Open Collect and sign in.
      - Go to Settings.
      - Select Security.
      - Select Delete data.
      - Choose a reason if you want to provide one.
      - Select Send verification code.
      - Enter the code sent to the phone number or confirmed email used for your Collect account and select Verify code.
      - If verification is unavailable, select Get help.
      - Select Submit request.
      - Review the confirmation and select Submit request.
      - Check or refresh request status in the app.
      path: Settings → Security → Delete data
    - id: delete-your-account-through-the-website
      heading: Request deletion without the app
      body: Contact Collect support to request account deletion. You do not need to reinstall the app
        to submit a deletion request.
      link: /account-deletion
      email: info@ikanisa.com
      recovery:
        heading: Email help and follow-up
        bullets:
        - If no email app opens, copy info@ikanisa.com into your email service.
        - Keep a copy of your email. If sending fails, check your email service before trying again.
        - For a follow-up, reply in the same conversation and include any request reference already supplied.
        closing: A sent email is not an acknowledgement from Collect or confirmation of deletion.
    - heading: What happens after a deletion request
      bullets:
      - Verify your identity before submitting your request.
      - Submit your request for review.
      - Keep your request reference. In the app, check or refresh request status; by email, reply in the same support conversation.
      closing: Submitting a request does not delete your account or records. Your account remains accessible
        while review is pending. Check request status or contact support for the outcome and any records
        that need to be retained.
    - heading: What may need to happen first
      bullets:
      - Resolve pending contribution records, reversals or disputes
      - Arrange a group-owner or administrator handover where required
      - Keep a copy of records you need
      - Discuss an active security investigation or legal hold with support
    - heading: What account deletion does not do
      bullets:
      - Move money or reverse a payment with your MoMo provider
      - Confirm erasure of retained contribution evidence, audit records or secured backups
      - Delete records independently held by another service
    - heading: Data we may retain
      bullets:
      - Contribution, reconciliation and audit records where a justified retention basis applies
      - Account and security records needed for an active investigation
      - Records needed to resolve a dispute or legal claim
      - Records subject to an identified applicable retention obligation or legal hold
      closing: A deletion request is not confirmation that ledger records, profiles or secured backups
        have been erased. Ask support which records are retained and why.
  - id: security
    heading: 13. Security and trust
    intro: 'We use safeguards designed to protect personal data, including:'
    bullets:
    - Encryption in transit
    - Encrypted retained evidence and private objects
    - Permission and session controls
    - Additional authentication for sensitive Admin actions
    - Retained audit and request records
    - Software checks and backup controls
    risk_statement: No technology system is completely risk-free. If a breach affects your rights or legally
      requires notification, we will notify affected users and the appropriate authority.
    trust_commitments:
    - We do not sell personal data.
    - Collect does not hold customer funds.
    - Raw receipt and roster records are not public group-card content.
    - A request receipt is not confirmation of deletion or provider settlement.
  - id: cookies
    heading: 14. Cookies and website analytics
    intro: 'Current service technologies include:'
    bullets:
    - Authentication and security cookies used by the Admin workspace
    - Browser storage needed for the available app or website functions
    closing: For questions about cookies and website technologies described in this notice, contact info@ikanisa.com.
    link: /privacy/#cookies
  - id: children
    heading: 15. Children
    body: Do not submit children’s personal information through Collect. Contact support if an account
      or record concerns a child so the request can be reviewed under the applicable requirements. Collect
      does not offer a youth financial product.
  - id: marketing
    heading: 16. Marketing
    body: Contact info@ikanisa.com to ask about communication preferences or to object to direct marketing.
      An optional promotional message is separate from an essential account, security or support communication.
  - id: changes
    heading: 17. Changes to this Policy
    body: We may update this Policy as Collect, our partners or legal requirements change. Material changes
      will be communicated through the app, website, email, SMS or another appropriate channel. The latest
      version will always show its effective date.
  - id: contact
    heading: 18. Contact and complaints
    details:
      privacy_email: info@ikanisa.com
    closing: You may also lodge a complaint with the competent data-protection authority.
