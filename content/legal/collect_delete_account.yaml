---
page:
  id: delete-account
  title: Delete Your Collect Account
  slug: "/account-deletion"
  seo:
    title: Delete Your Collect Account | Collect by IKANISA
    description: Request deletion of your Collect account and eligible personal data.
  hero:
    eyebrow: ACCOUNT AND DATA DELETION
    headline: Delete your Collect account.
    supporting_copy: You may request deletion of your Collect account and associated eligible personal data.
  important_notice: >-
    Deleting your Collect account does not automatically close any bank account, cancel any loan, cancel any insurance
    policy, remove a repayment obligation or remove records independently held by a regulated partner.
  delete_in_app:
    heading: Delete in the app
    path: Profile → Settings → Privacy and Security → Delete Account
    steps:
    - Open Collect
    - Go to Profile
    - Select Settings
    - Select Privacy and Security
    - Select Delete Account
    - Review the consequences
    - Verify your identity
    - Confirm your request
  delete_without_app:
    heading: Delete without the app
    copy: Complete the form below. You do not need to reinstall the app to submit a deletion request.
  form:
    id: account-deletion-request
    submit_label: Request Account Deletion
    fields:
    - name: full_name
      label: Full name
      type: text
      required: true
    - name: registered_phone
      label: Registered telephone number
      type: tel
      required: true
    - name: registered_email
      label: Registered email address
      type: email
      required: false
    - name: country
      label: Country
      type: select_or_text
      required: true
    - name: reason
      label: Reason for deletion
      type: textarea
      required: false
    - name: identity_verification_method
      label: Identity-verification method
      type: select
      required: true
      options:
      - SMS verification
      - Email verification
      - Identity document verification
      - Support-assisted verification
    - name: acknowledgement
      label: >-
        I understand that deleting my Collect account does not cancel any bank account, loan, insurance policy,
        group obligation or other product provided by a third party.
      type: checkbox
      required: true
  what_happens_next:
    heading: What happens next
    steps:
    - We verify your identity.
    - We review pending transactions and group responsibilities.
    - We tell you if any action is required.
    - We delete or anonymise eligible data.
    - >-
      We retain only records required by law or necessary for security, fraud prevention, disputes and regulatory
      compliance.
    - We confirm when the process is complete.
    service_target: We aim to respond within 30 days or within the period required by applicable law.
  before_we_can_complete_deletion:
    heading: You may need to complete these steps first
    bullets:
    - Withdraw or transfer any available balance through the relevant partner institution
    - Resolve pending contributions, reversals or disputes
    - Transfer a group-administrator role
    - Complete or cancel an active credit-readiness handoff
    - Download any statements you wish to keep
    - Address an active fraud, security or legal investigation
  data_we_may_retain:
    heading: Data we may retain
    bullets:
    - Financial transaction and audit records
    - KYC and AML records
    - Accounting and tax records
    - Fraud and security records
    - Records needed to resolve disputes or legal claims
    - Regulatory reports
    - Ledger entries needed to protect the rights of other group members
    closing: >-
      Where a ledger entry affects other members, the transaction record may remain while your profile is deleted,
      restricted or de-identified as far as legally and technically possible. Deleted data may remain temporarily
      in secured backups until those backups are overwritten.
  partner_products:
    heading: Products provided by partners
    copy: >-
      To close a bank account, cancel an insurance policy or discuss a loan, contact the relevant bank, insurer
      or other provider. Collect cannot cancel an independently provided regulated product on the partner’s behalf
      unless the partner has expressly enabled that workflow.
  contact:
    heading: Need help?
    email: info@ikanisa.com
    support_email: info@ikanisa.com
