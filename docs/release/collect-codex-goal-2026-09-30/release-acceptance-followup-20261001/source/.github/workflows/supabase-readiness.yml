name: Supabase Release Readiness
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact main commit approved for read-only verification
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: supabase-release-readiness
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-readiness
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Bind to reviewed commit
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
      - name: Require read-only credential
        env:
          DATABASE_URL: ${{ secrets.READONLY_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo 'Read-only release credential is missing'; exit 1; }
      - name: Read-only database audit
        env:
          DATABASE_URL: ${{ secrets.READONLY_DATABASE_URL }}
          PGOPTIONS: '-c default_transaction_read_only=on -c statement_timeout=15000'
        run: |
          command -v psql >/dev/null || { echo 'PostgreSQL client is required'; exit 1; }
          mkdir -p readiness
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f deploy/hardening/readiness_readonly.sql > readiness/database.txt
      - name: Preserve actual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: readonly-supabase-readiness
          path: readiness/
          if-no-files-found: error
          retention-days: 14
