include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - output/**
    # Hash-preserved partial source evidence is not a buildable Dart package.
    - docs/release/**/source-snapshot/**
    - docs/release/asset-build-hygiene-2026-09-30/removed-source/**
    - docs/release/admin-roster-reload-2026-09-30/sources-attempt1/**
    - docs/release/admin-roster-reload-2026-09-30/sources-attempt2-actual144/**
    - docs/release/admin-roster-reload-2026-09-30/sources-attempt3-current-logout/**
    - docs/release/local-browser-lifecycle-2026-09-30/logout-regression/source/**
    - docs/release/local-browser-lifecycle-2026-09-30/attempt4-uncaught-logout/source/**
    - docs/release/local-browser-lifecycle-2026-09-30/attempt5-current-logout/source/**
    - docs/release/shared-ui-accessibility-2026-09-30/*/source/**
  errors:
    missing_return: error
    missing_required_param: error
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    always_declare_return_types: true
    annotate_overrides: true
    avoid_print: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    prefer_final_fields: true
    prefer_final_in_for_each: true
    prefer_final_locals: true
    prefer_is_empty: true
    prefer_is_not_empty: true
    prefer_single_quotes: true
    sort_child_properties_last: true
    use_build_context_synchronously: true
    use_colored_box: true
    use_decorated_box: true
    use_key_in_widget_constructors: true
