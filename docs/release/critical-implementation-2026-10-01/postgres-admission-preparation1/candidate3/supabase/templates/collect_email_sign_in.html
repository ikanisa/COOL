<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Collect sign-in code</title>
  </head>
  <body style="margin:0;padding:32px 20px;background:#ffffff;color:#000000;font-family:Arial,sans-serif;line-height:1.5">
    <main style="max-width:480px;margin:0 auto">
      <h1 style="font-size:28px;line-height:1.2;margin:0 0 24px">Sign in to Collect</h1>
      <p>Enter this code in the Collect sign-in screen you opened.</p>
      <p aria-label="Your one-time sign-in code" style="font-size:32px;font-weight:700;letter-spacing:4px;margin:24px 0">{{ .Token }}</p>
      <p>If you did not request this code, you can ignore this email.</p>
      <p>Keep this code private. Collect will never ask you to send it in a message.</p>
    </main>
  </body>
</html>
