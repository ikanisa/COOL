    throw new GradleException('Reviewed publisher target identity drift')
}
def publishedCoreFiles = [:]
primaryModule.variants.each { variant ->
    (variant.files ?: []).each { file ->
        if (publishedCoreFiles[file.name] && publishedCoreFiles[file.name] != file) {
            throw new GradleException('Publisher variant file identity conflict')
        }
        publishedCoreFiles[file.name] = file
    }
