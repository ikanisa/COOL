def digestFile = { File file ->
    if (!file.isFile()) throw new GradleException('Missing observed regular artifact')
    def digest = MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        byte[] buffer = new byte[1024 * 1024]
        int count
        while ((count = input.read(buffer)) > 0) digest.update(buffer, 0, count)
    }
    digest.digest().encodeHex().toString()
}
if (digestFile(primaryModuleFile) != primaryModuleSha) {
    throw new GradleException('Reviewed independent publisher KGP module metadata drift')
}
