import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.UnresolvedDependencyResult
import java.security.MessageDigest

// Read the installed Flutter included build's real runtime configuration.
// No dependency, resolution rule, SDK source or cache bytes are replaced.
gradle.projectsEvaluated {
    def root = gradle.rootProject
    if (root.name != 'gradle' || root.findProject(':app') != null ||
        root.plugins.findPlugin('org.jetbrains.kotlin.jvm') == null) return
    root.tasks.register('collectSdkRuntimeGraph') {
        doLast {
            def cfg = root.configurations.getByName('runtimeClasspath')
            def result = cfg.incoming.resolutionResult
            def unresolved = result.allDependencies.findAll { it instanceof UnresolvedDependencyResult }
            if (!unresolved.isEmpty()) {
                println('COLLECT_SDK_UNRESOLVED_BEGIN')
                println(JsonOutput.toJson(unresolved.collect {
                    [requested: it.attempted.displayName, failure: it.failure.message]
                }))
                println('COLLECT_SDK_UNRESOLVED_END')
                throw new GradleException('Installed Flutter SDK runtime configuration has unresolved dependencies')
            }
            def modules = result.allComponents.findAll { it.id instanceof ModuleComponentIdentifier }
                .collect { [group: it.id.group, name: it.id.module, version: it.id.version] }
                .sort { a, b -> JsonOutput.toJson(a) <=> JsonOutput.toJson(b) }
            def provided = result.allComponents.findAll { !(it.id instanceof ModuleComponentIdentifier) }
                .collect { [display_name: it.id.displayName, kind: 'non-module'] }
                .sort { a, b -> JsonOutput.toJson(a) <=> JsonOutput.toJson(b) }
            def view = cfg.incoming.artifactView {
                componentFilter { id -> id instanceof ModuleComponentIdentifier }
            }
            def artifacts = view.artifacts.artifacts.collect { artifact ->
                def id = artifact.id.componentIdentifier
                if (!(id instanceof ModuleComponentIdentifier)) {
                    throw new GradleException('Unexpected non-module SDK runtime artifact')
                }
                def file = artifact.file
                if (!file.isFile()) throw new GradleException('Missing SDK runtime artifact')
                def digest = MessageDigest.getInstance('SHA-256')
                file.withInputStream { input ->
                    byte[] buffer = new byte[1024 * 1024]
                    int count
                    while ((count = input.read(buffer)) > 0) digest.update(buffer, 0, count)
                }
                [group: id.group, name: id.module, version: id.version, file: file.name,
                 bytes: file.length(), sha256: digest.digest().encodeHex().toString()]
            }.sort { a, b -> JsonOutput.toJson(a) <=> JsonOutput.toJson(b) }
            println('COLLECT_SDK_RUNTIME_GRAPH_BEGIN')
            println(JsonOutput.toJson([root_name: root.name, configuration: cfg.name,
                modules: modules, artifacts: artifacts, non_module_components: provided,
                scope: 'Real installed SDK included-build runtime resolution and external module artifact hashes. Gradle-provided non-module component identities are retained separately. Publisher authentication and advisory acceptance are separate. SDK source remains unchanged.']))
            println('COLLECT_SDK_RUNTIME_GRAPH_END')
        }
    }
}
