import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.component.ProjectComponentIdentifier
import org.gradle.api.artifacts.result.ResolvedDependencyResult
import org.gradle.api.artifacts.result.UnresolvedDependencyResult
import java.security.MessageDigest

def componentRecord(id) {
    if (id instanceof ModuleComponentIdentifier) return [kind: 'module', group: id.group, name: id.module, version: id.version]
    if (id instanceof ProjectComponentIdentifier) return [kind: 'project', path: id.projectPath]
    return [kind: 'other', display_name: id.displayName]
}

// Run with: ./gradlew -I ../scripts/supply_chain/gradle_runtime_inventory.init.gradle
//   :app:collectRuntimeGraph --offline --no-daemon
// The Flutter Gradle included build also loads init scripts; only the Android
// root project contains :app. External module artifact bytes are inventoried;
// project edges are retained separately because AGP publishes several secondary
// artifact types for plugin projects. This is not an AAB inventory or approval.
gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) return

    app.tasks.register('collectRuntimeGraph') {
        doLast {
            def configuration = app.findProperty('collectInventoryConfiguration') ?: 'productionReleaseRuntimeClasspath'
            if (!(configuration in ['productionReleaseRuntimeClasspath', 'productionReleaseCompileClasspath'])) {
                throw new GradleException('Only reviewed production compile/runtime graph configurations are supported')
            }
            def cfg = app.configurations.getByName(configuration)
            def resolution = cfg.incoming.resolutionResult
            def components = resolution.allComponents.collect { componentRecord(it.id) }
                .sort { a, b -> JsonOutput.toJson(a) <=> JsonOutput.toJson(b) }
            def unresolved = resolution.allDependencies.findAll { it instanceof UnresolvedDependencyResult }
            if (!unresolved.isEmpty()) {
                println('COLLECT_UNRESOLVED_DEPENDENCIES_BEGIN')
                println(JsonOutput.toJson(unresolved.collect {
                    def errors = []
                    def pending = [it.failure]
                    while (!pending.isEmpty()) {
                        def error = pending.remove(0)
                        errors.add(error.message)
                        if (error.cause != null) pending.add(error.cause)
                        if (error.hasProperty('causes')) pending.addAll(error.causes.findAll { cause -> cause != error.cause })
                    }
                    [requested: it.attempted.displayName, failures: errors]
                }))
                println('COLLECT_UNRESOLVED_DEPENDENCIES_END')
                throw new GradleException('Selected runtime graph has unresolved dependencies')
            }
            def edges = resolution.allDependencies.findAll { it instanceof ResolvedDependencyResult }.collect {
                [from: componentRecord(it.from.id), to: componentRecord(it.selected.id), constraint: it.constraint]
            }.sort { a, b -> JsonOutput.toJson(a) <=> JsonOutput.toJson(b) }
            def artifactView = cfg.incoming.artifactView {
                componentFilter { id -> id instanceof ModuleComponentIdentifier }
            }
            def artifacts = artifactView.artifacts.artifacts.collect { artifact ->
                def file = artifact.file
                def record = [component: componentRecord(artifact.id.componentIdentifier), file: file.name,
                              exists: file.isFile(), kind: file.name.tokenize('.').last()]
                if (file.isFile()) {
                    record.bytes = file.length()
                    def digest = MessageDigest.getInstance('SHA-256')
                    file.withInputStream { input ->
                        byte[] buffer = new byte[1024 * 1024]
                        int count
                        while ((count = input.read(buffer)) > 0) digest.update(buffer, 0, count)
                    }
                    record.sha256 = digest.digest().encodeHex().toString()
                }
                return record
            }.sort { a, b -> JsonOutput.toJson(a) <=> JsonOutput.toJson(b) }
            println('COLLECT_RUNTIME_GRAPH_BEGIN')
            def projectComponents = components.findAll { it.kind == 'project' }
            println(JsonOutput.toJson([configuration: cfg.name, components: components, edges: edges, artifacts: artifacts,
                                      project_artifact_scope: 'Project dependency edges only; final local plugin outputs are bound by the unsigned build packet',
                                      project_components: projectComponents,
                                      scope: 'Observed selected graph and available artifact hashes; no signed-artifact/license/advisory acceptance']))
            println('COLLECT_RUNTIME_GRAPH_END')
        }
    }
}
