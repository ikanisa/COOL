<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in to your account</title></head>
<body style="margin:0;padding:24px;background:#f3f5f8;color:#172233;font-family:Arial,sans-serif;line-height:1.6">
<main style="max-width:520px;margin:0 auto;padding:28px;background:#fff;border:1px solid #dce3eb;border-radius:12px">
<h1 style="font-size:24px;line-height:1.25">Sign in to your account</h1>
<p>Use the sign-in link or enter the one-time code in the application.</p>
<p><a href="{{ .ConfirmationURL }}">Sign in</a></p>
<p>Your one-time code:</p>
<p style="font-size:28px;font-weight:bold;letter-spacing:6px">{{ .Token }}</p>
<p>Keep this code private. If you did not request this action, you can ignore this message.</p>
</main></body></html>
