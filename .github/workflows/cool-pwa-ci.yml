name: COOL PWA CI

on:
  workflow_dispatch:

jobs:
  retired-pwa-target:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Explain retired target
        run: |
          test -f apps/pwa/wrangler.toml
          echo "apps/pwa is currently a retired Cloudflare Pages stub, not a Node app."
          echo "Restore package.json/tests here before re-enabling automatic PWA CI triggers."
