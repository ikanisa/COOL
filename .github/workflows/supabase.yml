name: Supabase migration qualification

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/supabase/**'
      - 'tools/collect-admin-mcp/**'
      - 'tools/notification-operator/**'
      - 'tools/roster-decoder/**'
      - 'scripts/qa/roster_wheelhouse.py'
      - 'scripts/tests/roster_wheelhouse_test.py'
      - 'scripts/tests/roster_decoder_lifecycle_support.py'
      - 'scripts/tests/roster_decoder_lifecycle_worker.py'
      - 'deploy/platform-api/**'
      - 'deploy/platform-supabase-free/**'
      - 'deploy/platform-admin/**'
      - 'test/supabase-free-transport.test.mjs'
      - 'test/local-challenge-parent.test.mjs'
      - 'lib/shared/models/**'
      - 'lib/core/data/exact_json_values.dart'
      - 'lib/shared/repositories/collect_repository_live_reader.dart'
      - 'test/current14_member_history_sql_receipts_test.dart'
      - 'test/self_hosted_member_history_sql_receipts_test.dart'
      - 'deploy/self-hosted/**'
      - 'deploy/collect-sms/**'
      - 'scripts/self_hosted/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.fvmrc'
      - '.github/workflows/supabase.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/supabase/**'
      - 'tools/collect-admin-mcp/**'
      - 'tools/notification-operator/**'
      - 'tools/roster-decoder/**'
      - 'scripts/qa/roster_wheelhouse.py'
      - 'scripts/tests/roster_wheelhouse_test.py'
      - 'scripts/tests/roster_decoder_lifecycle_support.py'
      - 'scripts/tests/roster_decoder_lifecycle_worker.py'
      - 'deploy/platform-api/**'
      - 'deploy/platform-supabase-free/**'
      - 'deploy/platform-admin/**'
      - 'test/supabase-free-transport.test.mjs'
      - 'test/local-challenge-parent.test.mjs'
      - 'lib/shared/models/**'
      - 'lib/core/data/exact_json_values.dart'
      - 'lib/shared/repositories/collect_repository_live_reader.dart'
      - 'test/current14_member_history_sql_receipts_test.dart'
      - 'test/self_hosted_member_history_sql_receipts_test.dart'
      - 'deploy/self-hosted/**'
      - 'deploy/collect-sms/**'
      - 'scripts/self_hosted/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.fvmrc'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:
    inputs:
      qualification_profile:
        description: Current candidate or an explicitly reviewed historical source
        type: choice
        default: current-self-hosted
        options: [current-self-hosted, historical-standard, historical-current14, historical-current16]
      reviewed_historical_commit:
        description: Exact reviewed 40-character historical commit; required only for a historical profile
        type: string
        default: ''
  workflow_call:

permissions:
  contents: read

jobs:
  current-source-contracts:
    name: Current source, safety, transport and frozen Edge contracts
    needs: select-profile
    if: needs.select-profile.outputs.profile == 'current-self-hosted'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COLLECT_CI_SYNTHETIC: 'true'
      COLLECT_DENO: ${{ github.workspace }}/scripts/supabase/node_modules/@deno/linux-x64-glibc/deno
      DENO_TLS_CA_STORE: system
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ needs.select-profile.outputs.source_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: scripts/supabase/package-lock.json
      - name: Install exact tooling without lifecycle scripts
        working-directory: scripts/supabase
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check deterministic baseline generation
        run: python3 supabase/schema-src/generate_baseline.py --check
      - name: Verify pure data encoding, custody and import planning contracts
        run: node --test scripts/supabase/data-contracts.test.mjs
      - name: Verify public build, cutover and diagnostic identity guards
        run: python3 -m unittest scripts.supabase.test_cutover_gate scripts.supabase.test_admin_build_config scripts.tests.client_diagnostic_identity_test
      - name: Verify self-hosted deployment and provider separation contracts
        run: |
          node --test deploy/self-hosted/*.test.mjs scripts/self_hosted/*.test.mjs scripts/supabase/deployment-profile.test.mjs
          python3 -m unittest scripts.self_hosted.test_operations.Configuration
      - name: Run every shared Node Edge contract through maintained exhaustive discovery
        run: node scripts/supabase/run_edge_node_tests.mjs
      - name: Verify current orchestration and retained historical source-admission guards
        run: node --test scripts/supabase/run_edge_node_tests.test.mjs scripts/supabase/testing/curated-platform-fixture.test.mjs scripts/supabase/testing/batch-capacity.test.mjs scripts/supabase/testing/current16-integration.test.mjs scripts/supabase/testing/current-self-hosted-native.test.mjs scripts/supabase/testing/self-hosted-member-history.test.mjs scripts/supabase/testing/admit-self-hosted-history.test.mjs
      - name: Verify scheduler and operator configuration contracts
        run: node --test scripts/supabase/jobs-config-contracts.test.mjs scripts/supabase/email_jobs_operator.test.mjs scripts/self_hosted/jobs-profile.test.mjs scripts/self_hosted/email-job-contract.test.mjs
      - name: Verify actual web hosting to Supabase transport contracts
        run: node --test deploy/platform-admin/test/backend-selection.test.mjs deploy/platform-admin/test/supabase-transport.test.mjs
      - name: Verify Admin static handoff and recovery
        run: node --test deploy/platform-admin/test/static-handoff.test.mjs
      - name: Verify roster decoder lifecycle and wheelhouse controls
        run: python3 scripts/tests/roster_wheelhouse_test.py
      - name: Verify recovered shared-domain fail-closed controls
        run: node --test scripts/supabase/testing/recovered-domain-safety.test.mjs
      - name: Verify public transport and human challenge parent contracts
        run: node --test test/supabase-free-transport.test.mjs test/local-challenge-parent.test.mjs
      - name: Verify private provider and privacy boundary protocols
        run: node --test deploy/platform-api/test/supabase_privacy_portal.test.mjs deploy/platform-api/test/privacy_email_portal.test.mjs deploy/platform-api/test/supabase_roster_decoder_protocol.test.mjs supabase/functions/_shared/tests/native-storage-semantics.test.mjs supabase/functions/send-sms-hook/handler.test.mjs deploy/self-hosted/auth-phone-proxy.test.mjs
      - name: Check all six current Edge entrypoints with the exact frozen lock
        working-directory: supabase/functions
        run: '"$COLLECT_DENO" task check'

  current-self-hosted-native:
    name: Current migration-chain native security, control, Auth, retention and delivery
    needs: select-profile
    if: needs.select-profile.outputs.profile == 'current-self-hosted'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: postgres:17.10@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
    env:
      COLLECT_CI_SYNTHETIC: 'true'
      COLLECT_NATIVE_PROFILE: control-concurrency
      COLLECT_TEST_PG_URL: postgres://collect_test:collect_local_fixture_only@127.0.0.1:55439/collect_schema_test
      COLLECT_FENCE_ADMIN_DATABASE_URL: postgres://collect_test:collect_local_fixture_only@127.0.0.1:55439/postgres
      COLLECT_MEMBER_REALTIME_ADMIN_DATABASE_URL: postgres://collect_test:collect_local_fixture_only@127.0.0.1:55439/postgres
      COLLECT_DENO: ${{ github.workspace }}/scripts/supabase/node_modules/@deno/linux-x64-glibc/deno
      DENO_TLS_CA_STORE: system
    steps:
      - name: Install the bounded job-container prerequisites
        run: |
          set -eu
          test "$(id -u)" -eq 0
          export DEBIAN_FRONTEND=noninteractive
          timeout --signal=TERM --kill-after=5s 150s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          timeout --signal=TERM --kill-after=5s 150s apt-get -o Dpkg::Use-Pty=0 --yes --no-install-recommends --no-upgrade install ca-certificates git python3 tar gzip xz-utils
          command -v gosu >/dev/null
          command -v initdb >/dev/null
          command -v pg_ctl >/dev/null
          command -v psql >/dev/null
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ needs.select-profile.outputs.source_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: scripts/supabase/package-lock.json
      - name: Install exact tooling without dependency lifecycle scripts
        working-directory: scripts/supabase
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify current-only target, source, migration and receipt guards
        run: node --test scripts/supabase/testing/current-self-hosted-native.test.mjs scripts/supabase/testing/self-hosted-member-history.test.mjs scripts/supabase/testing/curated-platform-fixture.test.mjs scripts/supabase/testing/admit-self-hosted-history.test.mjs
      - name: Warm and check every current native harness with frozen dependencies
        env:
          DENO_DIR: ${{ runner.temp }}/collect-current-selfhost-deno-cache
        run: |
          "$COLLECT_DENO" check --frozen --node-modules-dir=none --config=supabase/functions/deno.json --lock=supabase/functions/deno.lock scripts/supabase/testing/self-hosted-control-concurrency.ts scripts/supabase/testing/self-hosted-runtime.ts scripts/supabase/testing/self-hosted-backend-runtime.ts scripts/supabase/testing/self-hosted-auth-runtime.ts scripts/supabase/testing/self-hosted-retention-runtime.ts scripts/supabase/testing/notification-channels.ts scripts/supabase/testing/combined-self-hosted-scheduler.ts scripts/supabase/testing/gateway-fence.ts scripts/supabase/testing/self-hosted-momo-runtime.ts scripts/supabase/testing/self-hosted-contribution-review-runtime.ts deploy/collect-sms/test/gateway.test.ts
          cd supabase/functions
          "$COLLECT_DENO" task check
      - name: Start this job's fresh native PG17 cluster with60/3/0 limits
        run: sh scripts/supabase/testing/ci-native-postgres.sh start
      - name: Require all current migration-chain native harnesses and actual history receipts
        env:
          DENO_DIR: ${{ runner.temp }}/collect-current-selfhost-deno-cache
          COLLECT_SELFHOST_OUTPUT_DIR: ${{ runner.temp }}/collect-current-selfhost-native
        run: timeout --signal=TERM --kill-after=10s 900s node scripts/supabase/testing/current-self-hosted-native.mjs
      - name: Always stop only the job-owned native cluster
        if: always()
        run: |
          set -eu
          if [ -f scripts/supabase/testing/ci-native-postgres.sh ]; then
            sh scripts/supabase/testing/ci-native-postgres.sh stop
          elif [ -e "$RUNNER_TEMP/collect-supabase-ci-postgres.state" ]; then
            echo CI_POSTGRES_CLEANUP_SCRIPT_MISSING >&2
            exit 1
          fi
      - name: Preserve current evidence and failures without private descriptors
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: current-selfhost-native-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/collect-current-selfhost-native/INPUTS.json
            ${{ runner.temp }}/collect-current-selfhost-native/CLUSTER.json
            ${{ runner.temp }}/collect-current-selfhost-native/INSTALLATION.json
            ${{ runner.temp }}/collect-current-selfhost-native/RESULT.json
            ${{ runner.temp }}/collect-current-selfhost-native/*-CHILD.json
            ${{ runner.temp }}/collect-current-selfhost-native/CONTROL.json
            ${{ runner.temp }}/collect-current-selfhost-native/RUNTIME.json
            ${{ runner.temp }}/collect-current-selfhost-native/BACKEND.json
            ${{ runner.temp }}/collect-current-selfhost-native/AUTH.json
            ${{ runner.temp }}/collect-current-selfhost-native/RETENTION.json
            ${{ runner.temp }}/collect-current-selfhost-native/NOTIFICATIONS.json
            ${{ runner.temp }}/collect-current-selfhost-native/DATA_STAGE.json
            ${{ runner.temp }}/collect-current-selfhost-native/MOMO.json
            ${{ runner.temp }}/collect-current-selfhost-native/CONTRIBUTION_REVIEW.json
            ${{ runner.temp }}/collect-current-selfhost-native/GATEWAY.json
            ${{ runner.temp }}/collect-current-selfhost-native/GATEWAY.xml
            ${{ runner.temp }}/collect-current-selfhost-native/GATEWAY-FENCE.json
            ${{ runner.temp }}/collect-current-selfhost-native/SCHEDULER.json
            ${{ runner.temp }}/collect-current-selfhost-native/*.log
            ${{ runner.temp }}/collect-current-selfhost-native/runtime/CASES.json
            ${{ runner.temp }}/collect-current-selfhost-native/runtime/OBSERVATIONS.json
            ${{ runner.temp }}/collect-current-selfhost-native/runtime/WORK-CLOSURES.json
            ${{ runner.temp }}/collect-current-selfhost-native/runtime/NATIVE-RESULT.json
            ${{ runner.temp }}/collect-current-selfhost-native/history/INPUTS.json
            ${{ runner.temp }}/collect-current-selfhost-native/history/ACTUAL-HISTORY-PACKET.json
            ${{ runner.temp }}/collect-current-selfhost-native/history/ACTUAL-SQL-STATEMENTS.json
            ${{ runner.temp }}/collect-current-selfhost-native/history/DEFINES.json
            ${{ runner.temp }}/collect-current-selfhost-native/history/RESULT.json
            ${{ runner.temp }}/collect-current-selfhost-native/data-stage/INPUTS.json
            ${{ runner.temp }}/collect-current-selfhost-native/data-stage/SOURCE.sqlite
            ${{ runner.temp }}/collect-current-selfhost-native/data-stage/TYPED.sqlite

  current-self-hosted-history-dart:
    name: Decode actual current migration-chain history SQL with the matching Dart source
    needs: [select-profile, current-self-hosted-native]
    if: needs.select-profile.outputs.profile == 'current-self-hosted'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ needs.select-profile.outputs.source_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Read the exact checked-in Flutter version
        id: flutter-version
        run: echo "version=$(python3 -c 'import json; print(json.load(open(".fvmrc"))["flutter"])')" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true
      - name: Restore exact Dart dependency versions
        run: flutter pub get --enforce-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: current-selfhost-native-${{ github.sha }}
          path: ${{ runner.temp }}/collect-current-selfhost-native
      - name: Verify exact current packet, all source bytes and relative define paths
        run: node scripts/supabase/testing/admit-self-hosted-history.mjs "$RUNNER_TEMP/collect-current-selfhost-native/history" "$RUNNER_TEMP/collect-current-selfhost-history-defines.json"
      - name: Decode real pages, exact totals, dates and refusals
        run: flutter test --no-pub --concurrency=1 --tags=integration --dart-define-from-file="$RUNNER_TEMP/collect-current-selfhost-history-defines.json" test/self_hosted_member_history_sql_receipts_test.dart

  select-profile:
    name: Select the exact current or reviewed historical source
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      profile: ${{ steps.source.outputs.profile }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Refuse an implicit historical source or mutable ref
        id: source
        env:
          PROFILE: ${{ inputs.qualification_profile || 'current-self-hosted' }}
          REVIEWED_SHA: ${{ inputs.reviewed_historical_commit }}
        run: |
          python3 - <<'PYCODE'
          import os, re
          profile = os.environ['PROFILE']
          historical = profile in ('historical-standard', 'historical-current14', 'historical-current16')
          assert historical or profile == 'current-self-hosted'
          source = os.environ.get('REVIEWED_SHA', '') if historical else os.environ['GITHUB_SHA']
          assert re.fullmatch(r'[a-f0-9]{40}', source)
          assert not historical or os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
          if not historical:
              assert not os.environ.get('REVIEWED_SHA')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('profile=' + profile + '\nsource_sha=' + source + '\n')
          PYCODE

  local-qualification:
    needs: select-profile
    if: needs.select-profile.outputs.profile == 'historical-standard'
    name: Historical standard PostgreSQL and Edge contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Native PG and every run step share one network namespace. Preserve the
    # exact literal-loopback address/port guards in all maintained fixtures.
    container:
      image: postgres:17.10@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
    env:
      COLLECT_TEST_PG_URL: postgres://collect_test:collect_local_fixture_only@127.0.0.1:55439/collect_schema_test
      COLLECT_TEST_DATABASE_URL: postgres://collect_test:collect_local_fixture_only@127.0.0.1:55439/collect_edge_test
      COLLECT_FINANCIAL_TEST_DATABASE_URL: postgres://collect_test:collect_local_fixture_only@127.0.0.1:55439/collect_be02_green_3f624f3e7a6d_test
      COLLECT_RLS_HELPER_TEST_DATABASE_URL: postgres://collect_test:collect_local_fixture_only@127.0.0.1:55439/collect_rls_helper_acl_test
      COLLECT_PUBLIC_CONFIG_TEST_DATABASE_URL: postgres://collect_test:collect_local_fixture_only@127.0.0.1:55439/collect_public_configuration_test
      COLLECT_PRIVACY_EMAIL_TEST_DATABASE_URL: postgres://collect_test:collect_local_fixture_only@127.0.0.1:55439/collect_privacy_email_test
      COLLECT_SQL_MAINTENANCE_TEST_DATABASE_URL: postgres://collect_test:collect_local_fixture_only@127.0.0.1:55439/collect_sql_maintenance_test
      COLLECT_INVITATION_TEST_DATABASE_URL: postgres://collect_test:collect_local_fixture_only@127.0.0.1:55439/collect_admin_invitation_test
      COLLECT_INVITATION_NOTICE_TEST_DATABASE_URL: postgres://collect_test:collect_local_fixture_only@127.0.0.1:55439/collect_invitation_notice_test
      COLLECT_GOOGLE_TEST_DATABASE_URL: postgres://collect_test:collect_local_fixture_only@127.0.0.1:55439/collect_google_test
      COLLECT_PRIVATE_RETENTION_TEST_DATABASE_URL: postgres://collect_test:collect_local_fixture_only@127.0.0.1:55439/collect_private_retention_test
      COLLECT_JOBS_TEST_DATABASE_URL: postgres://collect_test:collect_local_fixture_only@127.0.0.1:55439/collect_jobs_test
      COLLECT_RECEIPT_FACTS_TEST_DATABASE_URL: postgres://collect_test:collect_local_fixture_only@127.0.0.1:55439/collect_receipt_facts_test
      COLLECT_DIAGNOSTICS_TEST_DATABASE_URL: postgres://collect_test:collect_local_fixture_only@127.0.0.1:55439/collect_diagnostics_test
      COLLECT_NOTIFICATION_DELIVERY_TEST_DATABASE_URL: postgres://collect_test:collect_local_fixture_only@127.0.0.1:55439/collect_notification_delivery_test
      COLLECT_SMS_CONTENT_TEST_DATABASE_URL: postgres://collect_test:collect_local_fixture_only@127.0.0.1:55439/collect_sms_content_test
      COLLECT_ADMIN_PASSWORD_POLICY_TEST_DATABASE_URL: postgres://collect_test:collect_local_fixture_only@127.0.0.1:55439/collect_admin_email_test
      COLLECT_ADMIN_PASSWORD_POLICY_STALE_TEST_DATABASE_URL: postgres://collect_test:collect_local_fixture_only@127.0.0.1:55439/collect_admin_email_test
      COLLECT_MFA_TEST_DATABASE_URL: postgres://collect_test:collect_local_fixture_only@127.0.0.1:55439/collect_mfa_test
      COLLECT_GROUPS_TEST_DATABASE_URL: postgres://collect_test:collect_local_fixture_only@127.0.0.1:55439/collect_groups_test
      COLLECT_AUTH_SOURCE_ROOT: ${{ github.workspace }}/supabase/functions/_shared
      COLLECT_CI_SYNTHETIC: 'true'
      COLLECT_FENCE_ADMIN_DATABASE_URL: postgres://collect_test:collect_local_fixture_only@127.0.0.1:55439/postgres
      COLLECT_MEMBER_REALTIME_ADMIN_DATABASE_URL: postgres://collect_test:collect_local_fixture_only@127.0.0.1:55439/postgres
      COLLECT_IMPORT_TEST_DATABASE_URL: postgres://collect_test:collect_local_fixture_only@127.0.0.1:55439/collect_import_test
      COLLECT_ADMIN_HISTORY_TEST_DATABASE_URL: postgres://collect_test:collect_local_fixture_only@127.0.0.1:55439/collect_admin_history_test
      COLLECT_PG_MODULE: ${{ github.workspace }}/scripts/supabase/node_modules/pg
      COLLECT_DENO: ${{ github.workspace }}/scripts/supabase/node_modules/@deno/linux-x64-glibc/deno
    steps:
      - name: Install and check job-container prerequisites without upgrading pinned tools
        run: |
          set -eu
          test "$(id -u)" -eq 0
          command -v apt-get >/dev/null
          command -v timeout >/dev/null
          export DEBIAN_FRONTEND=noninteractive
          timeout --signal=TERM --kill-after=5s 150s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          timeout --signal=TERM --kill-after=5s 150s apt-get -o Dpkg::Use-Pty=0 --yes --no-install-recommends --no-upgrade install ca-certificates git python3 tar gzip xz-utils
          git --version
          python3 --version
          command -v gosu >/dev/null
          command -v initdb >/dev/null
          command -v pg_ctl >/dev/null
          command -v psql >/dev/null
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ needs.select-profile.outputs.source_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: scripts/supabase/package-lock.json
      - name: Install exact tooling without dependency lifecycle scripts
        working-directory: scripts/supabase
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Start the owned native PostgreSQL fixture on literal loopback
        run: sh scripts/supabase/testing/ci-native-postgres.sh start
      - name: Check deterministic schema source
        run: python3 supabase/schema-src/generate_baseline.py --check
      - name: Create a separate disposable Edge handler fixture database
        run: |
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          const {Client}=createRequire(import.meta.url)(process.env.COLLECT_PG_MODULE);
          const db=new Client({connectionString:process.env.COLLECT_TEST_PG_URL});
          try { await db.connect(); await db.query('CREATE DATABASE collect_rls_helper_acl_test'); await db.query('CREATE DATABASE collect_public_configuration_test'); await db.query('CREATE DATABASE collect_privacy_email_test'); await db.query('CREATE DATABASE collect_admin_invitation_test'); await db.query('CREATE DATABASE collect_invitation_notice_test'); await db.query('CREATE DATABASE collect_receipt_facts_test'); await db.query('CREATE DATABASE collect_diagnostics_test'); await db.query('CREATE DATABASE collect_notification_delivery_test'); await db.query('CREATE DATABASE collect_sms_content_test'); await db.query('CREATE DATABASE collect_mfa_test'); await db.query('CREATE DATABASE collect_groups_test'); await db.query('CREATE DATABASE collect_private_retention_test'); await db.query('CREATE DATABASE collect_import_test'); await db.query('CREATE DATABASE collect_edge_test'); await db.query('CREATE DATABASE collect_be02_green_3f624f3e7a6d_test'); await db.query('CREATE DATABASE collect_google_test'); await db.query('CREATE DATABASE collect_admin_history_test'); await db.query('CREATE DATABASE collect_admin_email_test'); }
          finally { await db.end(); }
          NODE
