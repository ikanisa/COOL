  control-concurrency-native:
    needs: select-profile
    if: needs.select-profile.outputs.profile == 'historical-standard'
    name: Historical bounded control concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: postgres:17.10@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
    env:
      COLLECT_CI_SYNTHETIC: 'true'
      COLLECT_NATIVE_PROFILE: control-concurrency
      COLLECT_TEST_PG_URL: postgres://collect_test:collect_local_fixture_only@127.0.0.1:55439/collect_schema_test
      COLLECT_FENCE_ADMIN_DATABASE_URL: postgres://collect_test:collect_local_fixture_only@127.0.0.1:55439/postgres
      COLLECT_MEMBER_REALTIME_ADMIN_DATABASE_URL: postgres://collect_test:collect_local_fixture_only@127.0.0.1:55439/postgres
      COLLECT_DENO: ${{ github.workspace }}/scripts/supabase/node_modules/@deno/linux-x64-glibc/deno
    steps:
      - name: Install and check job-container prerequisites without upgrading pinned tools
        run: |
          set -eu
          test "$(id -u)" -eq 0
          command -v apt-get >/dev/null
          command -v timeout >/dev/null
          export DEBIAN_FRONTEND=noninteractive
          timeout --signal=TERM --kill-after=5s 150s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          timeout --signal=TERM --kill-after=5s 150s apt-get -o Dpkg::Use-Pty=0 --yes --no-install-recommends --no-upgrade install ca-certificates git python3 tar gzip xz-utils
          git --version
          python3 --version
          command -v gosu >/dev/null
          command -v initdb >/dev/null
          command -v pg_ctl >/dev/null
          command -v psql >/dev/null
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ needs.select-profile.outputs.source_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: scripts/supabase/package-lock.json
      - name: Install exact tooling without dependency lifecycle scripts
        working-directory: scripts/supabase
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Start a fresh separately owned native60/3/0 cluster
        run: sh scripts/supabase/testing/ci-native-postgres.sh start
      - name: Admit the locked native control dependency graph
        run: '"$COLLECT_DENO" check --frozen --config=supabase/functions/deno.json --lock=supabase/functions/deno.lock scripts/supabase/emergency-fence/native-control-concurrency.ts'
      - name: Require real control concurrency cleanup and warm-envelope proof
        run: |
          timeout --signal=TERM --kill-after=5s 120s node --input-type=module <<'NODE'
          import {spawn} from 'node:child_process';
          const target=new URL(process.env.COLLECT_FENCE_ADMIN_DATABASE_URL);
          if(target.protocol!=='postgres:'||target.hostname!=='127.0.0.1'||target.port!=='55439'||target.pathname!=='/postgres'||target.username!=='collect_test'||target.password!=='collect_local_fixture_only'||target.search||target.hash)throw Error('EXACT_FRESH_CI_LOCAL_TARGET_REQUIRED');
          target.pathname='/collect_fence_concurrency_'+crypto.randomUUID().replaceAll('-','').slice(0,16)+'_test';
          const env={COLLECT_FENCE_CONCURRENCY_TEST_DATABASE_URL:target.href,DENO_NO_UPDATE_CHECK:'1',NO_COLOR:'1'};
          for(const key of ['HOME','PATH','TMPDIR','DENO_DIR','LANG','LC_ALL','TZ'])if(process.env[key]!==undefined)env[key]=process.env[key];
          const child=spawn(process.env.COLLECT_DENO,['run','--check','--cached-only','--frozen','--config=supabase/functions/deno.json','--lock=supabase/functions/deno.lock','--allow-env','--allow-read='+process.cwd(),'--allow-net=127.0.0.1:55439','scripts/supabase/emergency-fence/native-control-concurrency.ts'],{env,shell:false,stdio:'inherit'});
          const code=await new Promise(resolve=>{child.once('error',()=>resolve(1));child.once('close',code=>resolve(code));});
          process.exitCode=code===0?0:1;
          NODE
      - name: Always stop only this job's owned native cluster
        if: always()
        run: sh scripts/supabase/testing/ci-native-postgres.sh stop

