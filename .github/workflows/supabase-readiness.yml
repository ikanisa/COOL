name: Supabase Readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/supabase-readiness.yml'
      - 'Makefile'
      - 'scripts/supabase_*.sh'
      - 'supabase/**'
  pull_request:
    paths:
      - '.github/workflows/supabase-readiness.yml'
      - 'Makefile'
      - 'scripts/supabase_*.sh'
      - 'supabase/**'
  workflow_dispatch:
    inputs:
      run_linked_readiness:
        description: 'Run linked Supabase readiness from this trusted runner with production Supabase secrets.'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  linked-readiness-skipped:
    name: Linked Supabase readiness skipped
    if: ${{ vars.SUPABASE_RUN_LINKED_READINESS != 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_linked_readiness != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Skipping linked Supabase readiness."
          echo "Enable it only from trusted branches/runners with production Supabase secrets."
          echo "Set repository variable SUPABASE_RUN_LINKED_READINESS=true, or dispatch this workflow with run_linked_readiness=true."

  linked-readiness:
    if: ${{ vars.SUPABASE_RUN_LINKED_READINESS == 'true' || (github.event_name == 'workflow_dispatch' && inputs.run_linked_readiness == 'true') }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: latest
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client ruby
      - name: Check linked Supabase readiness
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != '' && env.SUPABASE_DB_PASSWORD != '' && env.DATABASE_URL != ''
        run: |
          make supabase-ready
          make supabase-operational-report
      - name: Skip linked Supabase readiness
        if: env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_PROJECT_REF == '' || env.SUPABASE_DB_PASSWORD == '' || env.DATABASE_URL == ''
        run: echo "Skipping linked Supabase readiness because repository secrets are not configured."
