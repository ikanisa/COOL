name: iOS App Store

on:
  workflow_dispatch:
    inputs:
      operation:
        description: One scoped operation; signed IPA approval requires a later dispatch
        required: true
        default: unsigned_candidate
        type: choice
        options:
          - unsigned_candidate
          - signed_candidate
          - testflight_internal
          - metadata
          - screenshots
          - privacy_public
      expected_commit:
        description: Reviewed full main commit (must equal this dispatch SHA)
        required: true
        type: string
      source_sha256:
        description: Reviewed canonical source manifest SHA-256
        required: true
        type: string
      approval_record:
        description: External reviewed approval JSON, exact UTF-8 bytes (required for effects)
        required: false
        type: string
      approval_sha256:
        description: SHA-256 of exact approval_record input bytes, including whitespace
        required: false
        type: string
      signed_artifact_run_id:
        description: Successful signed_candidate run ID (internal TestFlight only)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-app-store-${{ inputs.operation }}-${{ github.ref }}
  cancel-in-progress: false

env:
  COLLECT_IOS_OPERATION: ${{ inputs.operation }}
  COLLECT_IOS_EXPECTED_REF: ${{ github.ref }}
  COLLECT_IOS_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
  COLLECT_IOS_SOURCE_SHA256: ${{ inputs.source_sha256 }}
  COLLECT_IOS_APPROVAL_SHA256: ${{ inputs.approval_sha256 }}

jobs:
  verify-source:
    name: Verify source without Apple credentials
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false
      - name: Set isolated delivery paths
        env:
          REVIEWED_APPROVAL_RECORD: ${{ inputs.approval_record }}
        run: |
          python3 -c 'import os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "ios-approval.json").write_bytes(os.environ["REVIEWED_APPROVAL_RECORD"].encode("utf-8"))'
          echo "COLLECT_IOS_APPROVAL_FILE=$RUNNER_TEMP/ios-approval.json" >> "$GITHUB_ENV"
          echo "COLLECT_IOS_CANDIDATE=$RUNNER_TEMP/collect-ios-pristine" >> "$GITHUB_ENV"
          echo "COLLECT_IOS_WORKDIR=$RUNNER_TEMP/collect-ios-work" >> "$GITHUB_ENV"
          echo "COLLECT_IOS_INSPECTION=$RUNNER_TEMP/ios-delivery/inspection.json" >> "$GITHUB_ENV"
          echo "COLLECT_IOS_IPA=$RUNNER_TEMP/ios-delivery/Collect.ipa" >> "$GITHUB_ENV"
      - name: Require reviewed main dispatch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$COLLECT_IOS_EXPECTED_COMMIT"
          test "$GITHUB_REPOSITORY" = ikanisa/COOL
      - name: Offline iOS source and effect contract regression
        run: python3 scripts/tests/ios_delivery_contract_test.py
      - name: Read pinned Flutter version
        id: flutter-version
        run: python3 -c 'import json; print("version=" + json.load(open(".fvmrc"))["flutter"])' >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true
      - name: Read back required protected environment before scheduling effects
        if: ${{ inputs.operation != 'unsigned_candidate' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/qa/ios_delivery_guard.py verify-environment --output "$RUNNER_TEMP/ios-environment-policy.json"
      - name: Export and verify reviewed source
        run: |
          python3 scripts/qa/ios_delivery_guard.py prepare --source "$GITHUB_WORKSPACE" --candidate "$COLLECT_IOS_CANDIDATE" --workdir "$COLLECT_IOS_WORKDIR" --flutter-sdk "$FLUTTER_ROOT"
      - name: Credential-free analysis and unsigned compilation
        if: ${{ inputs.operation == 'unsigned_candidate' || inputs.operation == 'signed_candidate' }}
        working-directory: ${{ env.COLLECT_IOS_WORKDIR }}
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub test/features/mobile_completion_test.dart test/shared/collect_repository_test.dart test/security_hygiene_test.dart
          flutter build ios --no-codesign --release --flavor production --no-pub
      - name: Verify source after credential-free checks
        if: ${{ inputs.operation == 'signed_candidate' }}
        run: python3 scripts/qa/ios_delivery_guard.py check --operation signed_candidate

  scoped-delivery:
    name: Scoped signing or Apple delivery
    needs: verify-source
    if: ${{ inputs.operation != 'unsigned_candidate' }}
    # These environment names require exported/read-back reviewer, main-only,
    # prevent-self-review and no-bypass policies. YAML cannot create that policy.
    environment: ${{ inputs.operation == 'signed_candidate' && 'collect-ios-signing' || inputs.operation == 'testflight_internal' && 'collect-ios-testflight' || inputs.operation == 'privacy_public' && 'collect-ios-privacy' || 'collect-ios-metadata' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false
      - name: Set isolated delivery paths
        env:
          REVIEWED_APPROVAL_RECORD: ${{ inputs.approval_record }}
        run: |
          python3 -c 'import os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "ios-approval.json").write_bytes(os.environ["REVIEWED_APPROVAL_RECORD"].encode("utf-8"))'
          echo "COLLECT_IOS_APPROVAL_FILE=$RUNNER_TEMP/ios-approval.json" >> "$GITHUB_ENV"
          echo "COLLECT_IOS_CANDIDATE=$RUNNER_TEMP/collect-ios-pristine" >> "$GITHUB_ENV"
          echo "COLLECT_IOS_WORKDIR=$RUNNER_TEMP/collect-ios-work" >> "$GITHUB_ENV"
          echo "COLLECT_IOS_INSPECTION=$RUNNER_TEMP/ios-delivery/inspection.json" >> "$GITHUB_ENV"
          echo "COLLECT_IOS_IPA=$RUNNER_TEMP/ios-delivery/Collect.ipa" >> "$GITHUB_ENV"
      - name: Read pinned Flutter version
        id: flutter-version
        run: python3 -c 'import json; print("version=" + json.load(open(".fvmrc"))["flutter"])' >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true
      - name: Export and verify approved source before Apple secrets
        run: |
          set -euo pipefail
          python3 scripts/qa/ios_delivery_guard.py prepare --source "$GITHUB_WORKSPACE" --candidate "$COLLECT_IOS_CANDIDATE" --workdir "$COLLECT_IOS_WORKDIR" --flutter-sdk "$FLUTTER_ROOT"
          mkdir -p "$RUNNER_TEMP/ios-delivery"
          cp "$COLLECT_IOS_CANDIDATE/.collect-release-candidate.json" "$RUNNER_TEMP/ios-delivery/source-manifest.json"
      - name: Recheck protected environment after review and before Apple secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/qa/ios_delivery_guard.py verify-environment --output "$RUNNER_TEMP/ios-delivery/environment-policy.json"
      - name: Set up pinned Ruby tools
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ${{ env.COLLECT_IOS_WORKDIR }}
      - name: Enforce Apple 2026 build toolchain
        if: ${{ inputs.operation == 'signed_candidate' }}
        run: |
          set -euo pipefail
          xcodebuild -version
          IOS_SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          ruby -e 'version = Gem::Version.new(ARGV.fetch(0)); abort("iOS 26 SDK or later is required") if version < Gem::Version.new("26.0")' "$IOS_SDK_VERSION"
      - name: Validate production package before signing
        if: ${{ inputs.operation == 'signed_candidate' }}
        working-directory: ${{ env.COLLECT_IOS_WORKDIR }}
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          ./scripts/notification_readiness_gate.sh
          ./scripts/ios_app_store_readiness_gate.sh
          python3 scripts/qa/ios_delivery_guard.py check --operation signed_candidate
      - name: Import scoped signing material
        if: ${{ inputs.operation == 'signed_candidate' }}
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          SUPABASE_PRODUCTION_URL: ${{ secrets.SUPABASE_PRODUCTION_URL }}
          SUPABASE_PRODUCTION_ANON_KEY: ${{ secrets.SUPABASE_PRODUCTION_ANON_KEY }}
          APP_PUBLIC_URL: https://collect.ikanisa.com
        run: python3 scripts/qa/ios_delivery_guard.py import-signing
      - name: Build and inspect signed candidate without distribution
        if: ${{ inputs.operation == 'signed_candidate' }}
        working-directory: ${{ env.COLLECT_IOS_WORKDIR }}
        env:
          SUPABASE_PRODUCTION_URL: ${{ secrets.SUPABASE_PRODUCTION_URL }}
          SUPABASE_PRODUCTION_ANON_KEY: ${{ secrets.SUPABASE_PRODUCTION_ANON_KEY }}
          APP_PUBLIC_URL: https://collect.ikanisa.com
        run: |
          set -euo pipefail
          bundle exec fastlane ios build_review_ipa
          cp build/ios/ipa/*.ipa "$COLLECT_IOS_IPA"
      - name: Remove temporary signing material and restore keychain list
        if: ${{ always() && inputs.operation == 'signed_candidate' }}
        run: python3 scripts/qa/ios_delivery_guard.py cleanup-signing
      - name: Save signed candidate for separate artifact review
        if: ${{ success() && inputs.operation == 'signed_candidate' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: collect-ios-signed-candidate
          path: ${{ runner.temp }}/ios-delivery/
          if-no-files-found: error
          retention-days: 14
      - name: Retrieve exact approved signed candidate
        if: ${{ inputs.operation == 'testflight_internal' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_RUN_ID: ${{ inputs.signed_artifact_run_id }}
        run: |
          set -euo pipefail
          [[ "$SIGNED_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SIGNED_RUN_ID" > "$RUNNER_TEMP/signed-run.json"
          python3 - <<'PY'
          import json, os
          run = json.load(open(os.environ['RUNNER_TEMP'] + '/signed-run.json'))
          assert run['head_sha'] == os.environ['COLLECT_IOS_EXPECTED_COMMIT']
          assert run['head_branch'] == 'main'
          assert run['path'] == '.github/workflows/ios-app-store.yml'
          assert run['event'] == 'workflow_dispatch' and run['conclusion'] == 'success'
          assert run['repository']['full_name'] == 'ikanisa/COOL'
          PY
          gh run download "$SIGNED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name collect-ios-signed-candidate --dir "$RUNNER_TEMP/ios-delivery"
          python3 scripts/qa/ios_delivery_guard.py check --operation testflight_internal
      - name: Recheck scope and bytes before delivery secrets
        if: ${{ inputs.operation != 'signed_candidate' }}
        run: python3 scripts/qa/ios_delivery_guard.py check --operation "$COLLECT_IOS_OPERATION"
      - name: Upload approved IPA to internal TestFlight
        if: ${{ inputs.operation == 'testflight_internal' }}
        working-directory: ${{ env.COLLECT_IOS_WORKDIR }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: bundle exec fastlane ios upload_review_build
      - name: Perform one approved metadata or screenshot operation
        if: ${{ inputs.operation == 'metadata' || inputs.operation == 'screenshots' }}
        working-directory: ${{ env.COLLECT_IOS_WORKDIR }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          COLLECT_REVIEW_PHONE: ${{ secrets.COLLECT_REVIEW_PHONE }}
          COLLECT_REVIEW_OTP: ${{ secrets.COLLECT_REVIEW_OTP }}
        run: |
          set -euo pipefail
          case "$COLLECT_IOS_OPERATION" in
            metadata) bundle exec fastlane ios upload_metadata_screenshots ;;
            screenshots) bundle exec fastlane ios upload_existing_app_store_screenshots ;;
            *) exit 1 ;;
          esac
      - name: Publish explicitly approved privacy answers
        if: ${{ inputs.operation == 'privacy_public' }}
        working-directory: ${{ env.COLLECT_IOS_WORKDIR }}
        env:
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
        run: bundle exec fastlane ios upload_app_privacy_details
