name: iOS App Store

on:
  workflow_dispatch:
    inputs:
      upload_metadata:
        description: Upload App Store metadata and screenshots
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      upload_build:
        description: Upload signed IPA to TestFlight
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: ios-app-store-${{ github.ref }}
  cancel-in-progress: false

jobs:
  app-store:
    name: Build and optional upload
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read pinned Flutter version
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open(".fvmrc", "r", encoding="utf-8") as handle:
              config = json.load(handle)

          print(f"version={config['flutter']}")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - name: Set up pinned Ruby tools
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Enforce Apple 2026 build toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          IOS_SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          ruby -e 'version = Gem::Version.new(ARGV.fetch(0)); abort("iOS 26 SDK or later is required") if version < Gem::Version.new("26.0")' "$IOS_SDK_VERSION"

      - name: Install Apple signing material
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE_BASE64"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_PROVISIONING_PROFILE_BASE64"
          test -n "$KEYCHAIN_PASSWORD"

          CERT_PATH="$RUNNER_TEMP/collect_distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/collect_appstore.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/collect-signing.keychain-db"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          KEYCHAINS=()
          while IFS= read -r keychain; do
            KEYCHAINS+=("${keychain//\"/}")
          done < <(security list-keychains -d user)
          security list-keychain -d user -s "$KEYCHAIN_PATH" "${KEYCHAINS[@]}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_APS_ENV=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:aps-environment' "$RUNNER_TEMP/profile.plist")
          test "$PROFILE_APS_ENV" = "production"
          /usr/libexec/PlistBuddy -c 'Print Entitlements:com.apple.developer.associated-domains' "$RUNNER_TEMP/profile.plist" >/dev/null
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

      - name: Flutter dependencies and checks
        run: |
          flutter --version
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub test/features/mobile_completion_test.dart test/shared/collect_repository_test.dart test/security_hygiene_test.dart

      - name: Validate iOS App Store package
        run: |
          ./scripts/notification_readiness_gate.sh
          ./scripts/ios_app_store_readiness_gate.sh

      - name: Stage App Store screenshots
        run: bundle exec fastlane ios prepare_app_store_assets

      - name: Upload metadata and screenshots
        if: ${{ inputs.upload_metadata == 'true' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          COLLECT_REVIEW_PHONE: ${{ secrets.COLLECT_REVIEW_PHONE }}
          COLLECT_REVIEW_OTP: ${{ secrets.COLLECT_REVIEW_OTP }}
        run: bundle exec fastlane ios upload_metadata_screenshots

      - name: Build App Review IPA
        env:
          SUPABASE_PRODUCTION_URL: ${{ secrets.SUPABASE_PRODUCTION_URL }}
          SUPABASE_PRODUCTION_ANON_KEY: ${{ secrets.SUPABASE_PRODUCTION_ANON_KEY }}
          APP_PUBLIC_URL: https://collect.ikanisa.com
        run: bundle exec fastlane ios build_review_ipa

      - name: Upload build to TestFlight
        if: ${{ inputs.upload_build == 'true' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: bundle exec fastlane ios upload_review_build

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: collect-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: ignore
          retention-days: 14
