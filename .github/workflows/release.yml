name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Build & Distribute
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Flutter version
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open(".fvmrc", "r", encoding="utf-8") as handle:
              config = json.load(handle)

          print(f"version={config['flutter']}")
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc
          cache: true

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install PostgreSQL client
        if: ${{ secrets.SUPABASE_DB_URL != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Sync hosted Supabase function secrets
        if: ${{ secrets.SUPABASE_PROJECT_REF != '' && secrets.SUPABASE_ACCESS_TOKEN != '' }}
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PRODUCTION_URL: ${{ secrets.SUPABASE_PRODUCTION_URL || secrets.SUPABASE_URL }}
          SUPABASE_PRODUCTION_ANON_KEY: ${{ secrets.SUPABASE_PRODUCTION_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON || secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_ANDROID_PRODUCTION_PROJECT_ID }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          OTP_CODE_HASH_SECRET: ${{ secrets.OTP_CODE_HASH_SECRET }}
          AUTH_PHONE_PASSWORD_SECRET: ${{ secrets.AUTH_PHONE_PASSWORD_SECRET }}
          AI_SMS_PARSE_PROVIDER: ${{ secrets.AI_SMS_PARSE_PROVIDER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SMS_PARSE_MODEL: ${{ secrets.OPENAI_SMS_PARSE_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_SMS_PARSE_MODEL: ${{ secrets.GEMINI_SMS_PARSE_MODEL }}
          GOOGLE_MAPS_SERVER_API_KEY: ${{ secrets.GOOGLE_MAPS_SERVER_API_KEY }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
          TICKET_QR_HMAC_SECRET: ${{ secrets.TICKET_QR_HMAC_SECRET }}
          GENERATE_AI_CONTENT_CRON_SECRET: ${{ secrets.GENERATE_AI_CONTENT_CRON_SECRET || secrets.CRON_JOB_SECRET }}
          CRON_JOB_SECRET: ${{ secrets.CRON_JOB_SECRET || secrets.GENERATE_AI_CONTENT_CRON_SECRET }}
          GOOGLE_WALLET_ISSUER_ID: ${{ secrets.GOOGLE_WALLET_ISSUER_ID }}
          GOOGLE_WALLET_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_WALLET_SERVICE_ACCOUNT_JSON }}
          GOOGLE_WALLET_ISSUER_NAME: ${{ secrets.GOOGLE_WALLET_ISSUER_NAME }}
          GOOGLE_WALLET_ALLOWED_ORIGINS: ${{ secrets.GOOGLE_WALLET_ALLOWED_ORIGINS }}
          COOL_PUBLIC_APP_BASE_URL: ${{ secrets.COOL_PUBLIC_APP_BASE_URL }}
          STRICT_CORE: '1'
        run: bash scripts/sync_supabase_function_secrets.sh

      # ── Gate: release readiness must pass ──────────────────
      - name: Run release readiness checks
        env:
          SKIP_ANDROID_FLAVOR_BUILDS: '1'
          RUN_MOMO_SMS_ROLLOUT_VERIFY: ${{ secrets.SUPABASE_DB_URL != '' && '1' || '0' }}
          RUN_REMOTE_SMOKE: ${{ secrets.SUPABASE_PROJECT_REF != '' && secrets.SUPABASE_ACCESS_TOKEN != '' && '1' || '0' }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          COOL_ANDROID_PLAY_APP_SIGNING_SHA256_CERT_FINGERPRINT: ${{ secrets.COOL_ANDROID_PLAY_APP_SIGNING_SHA256_CERT_FINGERPRINT }}
          COOL_IOS_TEAM_ID: ${{ secrets.COOL_IOS_TEAM_ID }}
          COOL_IOS_APP_STORE_ID: ${{ secrets.COOL_IOS_APP_STORE_ID }}
          COOL_REQUIRE_IOS_RELEASE_METADATA: '1'
        run: bash scripts/release_readiness.sh

      # ── Decode signing key ─────────────────────────────────
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks

      - name: Create key.properties
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore.jks
          EOF

      # ── Build signed APK ───────────────────────────────────
      - name: Build release APK
        env:
          SUPABASE_PRODUCTION_URL: ${{ secrets.SUPABASE_PRODUCTION_URL || secrets.SUPABASE_URL }}
          SUPABASE_PRODUCTION_ANON_KEY: ${{ secrets.SUPABASE_PRODUCTION_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          FIREBASE_ANDROID_PRODUCTION_API_KEY: ${{ secrets.FIREBASE_ANDROID_PRODUCTION_API_KEY }}
          FIREBASE_ANDROID_PRODUCTION_APP_ID: ${{ secrets.FIREBASE_ANDROID_PRODUCTION_APP_ID }}
          FIREBASE_ANDROID_PRODUCTION_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_ANDROID_PRODUCTION_MESSAGING_SENDER_ID }}
          FIREBASE_ANDROID_PRODUCTION_PROJECT_ID: ${{ secrets.FIREBASE_ANDROID_PRODUCTION_PROJECT_ID }}
          FIREBASE_ANDROID_PRODUCTION_STORAGE_BUCKET: ${{ secrets.FIREBASE_ANDROID_PRODUCTION_STORAGE_BUCKET }}
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
          GOOGLE_MAPS_ANDROID_MAP_ID: ${{ secrets.GOOGLE_MAPS_ANDROID_MAP_ID }}
        run: bash scripts/build_production.sh

      # ── Upload to Firebase App Distribution ─────────────────
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: staff
          file: build/app/outputs/flutter-apk/app-production-release.apk
          releaseNotes: |
            Release ${{ github.ref_name }}
            Commit: ${{ github.sha }}

      # ── Upload APK as build artifact ────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.ref_name }}
          path: build/app/outputs/flutter-apk/app-production-release.apk
          retention-days: 30
