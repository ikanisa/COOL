name: Dependency Audit

on:
  schedule:
    # Run weekly on Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  push:
    branches: [main]
    paths:
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:

jobs:
  audit:
    name: Flutter Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check for outdated dependencies
        run: dart pub outdated

      - name: Analyze for deprecation warnings
        run: flutter analyze --no-fatal-infos 2>&1 | grep -i "deprecat" || echo "No deprecation warnings found."

      - name: Check for known vulnerabilities
        run: |
          echo "=== Checking pubspec.lock for known advisories ==="
          # dart pub outdated already flags packages with advisories
          dart pub outdated --json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          pkgs = data.get('packages', [])
          advisories = [p for p in pkgs if p.get('advisories')]
          if advisories:
            for p in advisories:
              print(f\"⚠️  {p['package']}: {len(p['advisories'])} advisory(ies)\")
              for a in p['advisories']:
                print(f\"   - {a.get('title', 'No title')}\")
            sys.exit(1)
          else:
            print('✅ No known advisories found.')
          " || echo "Advisory check completed (non-blocking)."
