name: CodeQL

on:
  push:
    branches:
      - main
      - develop
    paths:
      - '.github/workflows/codeql.yml'
      - 'deploy/platform-api/**/*.js'
      - 'deploy/platform-admin/**/*.js'
      - 'supabase/functions/**/*.js'
      - 'supabase/functions/**/*.ts'
      - 'deploy/platform-supabase-free/**/*.js'
      - 'deploy/platform-supabase-free/**/*.mjs'
  pull_request:
    paths:
      - '.github/workflows/codeql.yml'
      - 'deploy/platform-api/**/*.js'
      - 'deploy/platform-admin/**/*.js'
      - 'supabase/functions/**/*.js'
      - 'supabase/functions/**/*.ts'
      - 'deploy/platform-supabase-free/**/*.js'
      - 'deploy/platform-supabase-free/**/*.mjs'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze backend services
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: /language:javascript-typescript
