name: CodeQL

on:
  push:
    branches:
      - main
      - develop
    paths:
      - '.github/workflows/codeql.yml'
      - 'admin-web/**'
      - 'deploy/platform-api/**/*.js'
      - 'deploy/platform-admin/**/*.js'
      - 'deploy/platform-admin/**/*.mjs'
      - 'deploy/managed-sms/**'
      - 'deploy/collect-sms/src/**'
      - 'supabase/functions/**/*.js'
      - 'supabase/functions/**/*.mjs'
      - 'supabase/functions/**/*.ts'
  pull_request:
    paths:
      - '.github/workflows/codeql.yml'
      - 'admin-web/**'
      - 'deploy/platform-api/**/*.js'
      - 'deploy/platform-admin/**/*.js'
      - 'deploy/platform-admin/**/*.mjs'
      - 'deploy/managed-sms/**'
      - 'deploy/collect-sms/src/**'
      - 'supabase/functions/**/*.js'
      - 'supabase/functions/**/*.mjs'
      - 'supabase/functions/**/*.ts'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze React Admin and backend services
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
