name: COOL PWA Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "apps/cool-pwa/**"
  pull_request:
    paths:
      - "apps/cool-pwa/**"

concurrency:
  group: cool-pwa-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: apps/cool-pwa
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: apps/cool-pwa
        run: npx playwright install --with-deps chromium

      - name: Contract and browser tests
        working-directory: apps/cool-pwa
        run: npm test

      - name: Lighthouse audit
        working-directory: apps/cool-pwa
        run: npm run audit:lighthouse

  deploy-preview:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Cloudflare Pages (preview)
        working-directory: apps/cool-pwa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest pages deploy . --project-name=cool --branch=${{ github.head_ref }}

  deploy-production:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://cool.ikanisa.com/admin/
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Cloudflare Pages (production)
        working-directory: apps/cool-pwa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest pages deploy . --project-name=cool --branch=main

      - name: Install dependencies for smoke test
        working-directory: apps/cool-pwa
        run: npm ci

      - name: Install Chromium for smoke test
        working-directory: apps/cool-pwa
        run: npx playwright install --with-deps chromium

      - name: Post-deploy smoke test
        working-directory: apps/cool-pwa
        env:
          SMOKE_URL: https://cool.ikanisa.com
        run: node scripts/post-deploy-smoke.mjs
