name: COOL PWA Deploy

on:
  workflow_dispatch:

concurrency:
  group: cool-pwa-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retired-pwa-target:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Explain retired target
        run: |
          test -f apps/pwa/wrangler.toml
          echo "apps/pwa is currently a retired Cloudflare Pages stub, not a deployable Node app."
          echo "Restore package.json/tests/build output here before re-enabling this deployment workflow."
