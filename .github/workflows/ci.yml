name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ── Shared setup anchor ───────────────────────────────────────────────
# Re-used across parallel jobs via composite actions isn't needed here;
# each job declares its own setup for clarity and cache independence.

jobs:
  # ── 0. Repo hygiene (fast ~10s) ────────────────────────────────────
  repo-hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Secret & binary file scan
        run: |
          BLOCKED_PATTERNS='\.jks$|\.keystore$|\.bak$|\.old$|\.orig$|sa-key.*\.json$'
          ALLOW_LIST='\.gitignore$|\.env\.example$'
          MATCHES=$(git ls-files | grep -E "$BLOCKED_PATTERNS" | grep -vE "$ALLOW_LIST" || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Tracked files match blocked patterns:"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ No blocked secret/binary files tracked"

      - name: Release secret scan
        run: make release-secret-scan

      - name: Verify declared CI credential and MCP boundaries
        run: |
          python3 scripts/qa/collect_ci_policy.py
          python3 scripts/tests/test_collect_ci_policy.py

      - name: Source integrity
        run: make source-integrity

      - name: Sole Revolut design authority
        run: |
          make revolut-design-authority
          python3 scripts/tests/revolut_design_authority_test.py

      - name: Verify asset manifest and Rwanda runtime inventory
        run: |
          ruby scripts/tests/asset_manifest_integrity_test.rb
          ruby scripts/tests/group_runtime_integrity_test.rb
          ruby scripts/qa/group_runtime_integrity.rb --root . --json
          python3 scripts/tests/rwanda_release_scope_test.py

      - name: QA tooling regression tests
        run: make qa-tooling-test

      - name: Coverage gate regression tests
        run: python3 scripts/tests/coverage_gate_test.py

      - name: Patch marker scan
        run: |
          MATCHES=$(git grep -n -E '^\*\*\* (Begin Patch|Add File:|Update File:|Delete File:|Move to:|End Patch)$' -- \
            '.github/workflows/**' \
            'android/**' \
            'ios/**' \
            'lib/**' \
            'scripts/**' \
            'supabase/**' \
            'test/**' \
            'integration_test/**' \
            'tool/**' || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Committed source contains raw patch markers:"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ No raw patch markers found in committed source"

      - name: Supabase migration validation
        run: bash scripts/migrations/validate_supabase_migrations.sh

      - name: Deprecated theme API budget
        run: |
          COUNT=$(grep -rl 'AppColors\|CoolPalette' lib/ 2>/dev/null | wc -l | tr -d ' ')
          BUDGET=8
          echo "📊 Deprecated theme API files: $COUNT (budget: $BUDGET)"
          if [ "$COUNT" -gt "$BUDGET" ]; then
            echo "::error::Deprecated theme API usage ($COUNT files) exceeds budget ($BUDGET). Migrate before merging."
            exit 1
          fi
          echo "✅ Theme API budget OK"

      - name: Large file size check
        run: |
          WARN=500
          FAIL=1200
          EXIT_CODE=0

          while IFS= read -r file; do
            lines=$(wc -l < "$file" | tr -d ' ')
            case "$file" in
              lib/l10n/app_localizations.dart|lib/l10n/app_localizations_*.dart|*.g.dart)
                continue
                ;;
            esac
            if [ "$lines" -gt "$FAIL" ]; then
              echo "::error::$file ($lines lines) exceeds hard limit ($FAIL)"
              EXIT_CODE=1
            elif [ "$lines" -gt "$WARN" ]; then
              echo "::warning::$file ($lines lines) exceeds soft limit ($WARN)"
            fi
          done < <(find lib/ -name '*.dart' -type f 2>/dev/null)

          while IFS= read -r file; do
            lines=$(wc -l < "$file" | tr -d ' ')
            if [ "$lines" -gt "$FAIL" ]; then
              echo "::error::$file ($lines lines) exceeds hard limit ($FAIL)"
              EXIT_CODE=1
            elif [ "$lines" -gt "$WARN" ]; then
              echo "::warning::$file ($lines lines) exceeds soft limit ($WARN)"
            fi
          done < <(find supabase/functions -name '*.ts' -type f 2>/dev/null)

          exit $EXIT_CODE

  # ── 1. Static analysis (fast ~30s) ─────────────────────────────────
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read pinned Flutter version
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open(".fvmrc", "r", encoding="utf-8") as handle:
              config = json.load(handle)

          print(f"version={config['flutter']}")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - run: flutter pub get --enforce-lockfile
      - name: Verify pinned local file_saver fork
        run: |
          python3 scripts/supply_chain/verify_file_saver_fork.py --fetch --check
          python3 -m unittest scripts.tests.file_saver_fork_provenance_test
      - name: Verify retained Firebase Messaging and GoTrue fork provenance
        run: |
          python3 scripts/tests/pub_fork_origin_test.py
          python3 scripts/supply_chain/verify_pub_forks.py fetch --cache-dir "$RUNNER_TEMP/collect-pub-forks"
          python3 scripts/supply_chain/verify_pub_forks.py verify --cache-dir "$RUNNER_TEMP/collect-pub-forks" --output "$RUNNER_TEMP/collect-pub-forks-verification.json"
      - name: Verify canonical product capability content
        run: |
          ruby scripts/generate_product_capability_content.rb --check
          ruby scripts/tests/product_capability_content_test.rb
          ruby scripts/tests/public_capability_contract_test.rb
      - name: Set up pinned Node for public media fixture checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Verify public media bootstrap boundaries
        run: |
          node scripts/tests/public_media_bootstrap_test.mjs
          node --test scripts/tests/collect_diagnostic_observer_test.mjs scripts/tests/public_browser_served_resource_test.mjs
      - run: make format-check
      - run: flutter analyze --fatal-infos

  # ── 2. Unit Tests (medium ~1.5min) ───────────────────────────────────
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read pinned Flutter version
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open(".fvmrc", "r", encoding="utf-8") as handle:
              config = json.load(handle)

          print(f"version={config['flutter']}")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Run unit + widget tests
        run: flutter test --concurrency=4 --exclude-tags=integration --test-randomize-ordering-seed=random --file-reporter json:test-results.json --coverage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-results
          path: test-results.json
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 14

      - name: Coverage threshold gate
        run: |
          ruby scripts/qa/lcov_coverage.rb coverage/lcov.info 40
          python3 scripts/qa/coverage_gate.py coverage/lcov.info --threshold 40

  # ── 2b. Admin web source compilation (all branches) ────────────────
  admin-web-build:
    name: Admin Web Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [analyze]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read pinned Flutter version
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open(".fvmrc", "r", encoding="utf-8") as handle:
              config = json.load(handle)

          print(f"version={config['flutter']}")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Build canonical Cloudflare Admin candidate
        env:
          FLUTTER: flutter
        run: bash scripts/admin_cloudflare_build.sh

      - name: Retain exact Admin candidate and working-input identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: admin-cloudflare-candidate
          path: |
            build/admin-cloudflare/
            build/admin-cloudflare-source.json
            build/admin-cloudflare-artifact.json
            build/admin-cloudflare-preflight.json
          retention-days: 14
          if-no-files-found: error

  # Reuse the canonical build. CI acceptance is distinct from hosted cutover.
  admin-cloudflare-candidate:
    name: Cloudflare Admin Candidate Identity
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [repo-hygiene, admin-web-build, cloudflare-backend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: admin-cloudflare-candidate
          path: build
      - name: Verify actual candidate matches the clean workflow commit
        run: |
          python3 scripts/admin_cloudflare_artifact.py verify build/admin-cloudflare build/admin-cloudflare-source.json build/admin-cloudflare-artifact.json
          python3 scripts/admin_cloudflare_preflight.py --build-root build/admin-cloudflare --source-manifest build/admin-cloudflare-source.json --artifact-manifest build/admin-cloudflare-artifact.json --config deploy/admin.cloudflare.wrangler.jsonc --target-origin https://admin-preview.collect.ikanisa.com --output build/admin-cloudflare-preflight.json
          python3 - <<'PY_IDENTITY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path('build/admin-cloudflare')
          version = json.loads((root / 'version.json').read_text())
          source = json.loads(Path('build/admin-cloudflare-source.json').read_text())
          for record in (version, source):
              if record.get('source_commit') != os.environ['GITHUB_SHA'] or record.get('source_dirty') is not False:
                  raise SystemExit('Admin candidate does not match the clean workflow commit')
          if version.get('source_manifest_sha256') != source['source_manifest_sha256']:
              raise SystemExit('Admin source identity differs from candidate metadata')
          if version.get('main_dart_js_sha256') != hashlib.sha256((root / 'main.dart.js').read_bytes()).hexdigest():
              raise SystemExit('Admin asset bytes differ from candidate metadata')
          if version.get('backend') != 'cloudflare' or version.get('minimum_core_schema_migration') != '0012_gateway_receiver_ingress.sql':
              raise SystemExit('Admin candidate targets an outdated runtime/schema')
          PY_IDENTITY
          echo 'Canonical Admin build and backend CI pass; hosted role/provider/recovery/device and production acceptance remain separate.' >> "$GITHUB_STEP_SUMMARY"

  # ── 3. Fixture journey smoke (native device UAT runs separately) ────
  integration-test:
    name: Member and Admin journey smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read pinned Flutter version
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open(".fvmrc", "r", encoding="utf-8") as handle:
              config = json.load(handle)

          print(f"version={config['flutter']}")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Run member and Admin fixture journeys
        run: >-
          flutter test --no-pub --concurrency=4
          test/persona_uat_smoke_test.dart
          test/features/auth_error_recovery_test.dart
          test/features/mobile_review_navigation_test.dart
          test/admin_login_recovery_test.dart
          test/admin_data_sync_test.dart
          test/admin_list_models_test.dart
          test/admin_list_paging_test.dart
          test/admin_repository_paging_test.dart
          --file-reporter json:test-results.json

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-test-results
          path: test-results.json
          retention-days: 14

  # ── 4. Governance docs + deep-link checks (fast ~15s) ──────────────
  docs-check:
    name: Docs sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate notification and deep-link routing
        run: bash scripts/notification_readiness_gate.sh

      - name: Build and validate public deep-link assets
        run: bash scripts/public_website_ci_gate.sh static

  # ── 5. Pinned Edge types, units, HTTP and actual Linux decoder ─────
  deno-check:
    name: Deno (edge functions and Linux decoder)
    # requirements.lock contains Linux ARM64 wheels; exercise their actual ABI.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pinned Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version-file: .dvmrc
          cache: true

      - name: Set up decoder fixture Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12.14'

      - name: Acquire exact publisher-authenticated Linux decoder wheels
        run: |
          set -euo pipefail
          wheel_inputs="$GITHUB_WORKSPACE/.cache/edge-ci-publisher"
          lock_pin="$(sha256sum tools/roster-decoder/requirements.lock | cut -d ' ' -f 1)"
          python3 -B scripts/qa/roster_wheelhouse.py --acquire \
            --lock-file tools/roster-decoder/requirements.lock --lock-sha256 "$lock_pin" \
            --destination "$wheel_inputs"

      - name: Install hash-locked offline decoder fixture dependencies
        run: |
          set -euo pipefail
          wheel_inputs="$GITHUB_WORKSPACE/.cache/edge-ci-publisher"
          python -m venv .cache/edge-ci-python
          .cache/edge-ci-python/bin/python -m pip install --disable-pip-version-check \
            --no-index --find-links="$wheel_inputs/wheels" --only-binary=:all: \
            --require-hashes -r tools/roster-decoder/requirements.lock

      - name: Run canonical frozen Edge and Linux acceptance
        run: |
          set -euo pipefail
          wheel_inputs="$GITHUB_WORKSPACE/.cache/edge-ci-publisher"
          publisher_pin="$(sha256sum "$wheel_inputs/publisher-inputs.json" | cut -d ' ' -f 1)"
          python3 -B scripts/qa/run_edge_ci.py --deno "$(command -v deno)" \
            --decoder-python .cache/edge-ci-python/bin/python \
            --wheel-source "$wheel_inputs/wheels" \
            --publisher-receipt "$wheel_inputs/publisher-inputs.json" \
            --publisher-sha256 "$publisher_pin" \
            --metadata-directory "$wheel_inputs/primary" \
            --cache-dependencies --output .cache/edge-ci

      - name: Preserve completed and failed Edge evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: edge-ci-evidence
          path: |
            .cache/edge-ci
            .cache/edge-ci-publisher
            .cache/edge-ci-publisher-supervision
          include-hidden-files: true
          retention-days: 14

  ordinary-sql:
    name: Ordinary installer SQL (synthetic clean and populated)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pinned SQL recipe Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12.14'

      - name: Verify SQL recipe refusal and cleanup boundaries
        run: python3 -B -m unittest discover -s scripts/tests -p sql_ci_runner_test.py

      - name: Verify full recovery comparison and refusal boundaries
        run: python3 -B -m unittest discover -s scripts/tests -p current_recovery_roundtrip_test.py -v

      - name: Acquire named PostgreSQL image and refuse config drift
        timeout-minutes: 3
        run: |
          set -euo pipefail
          # Acquisition uses this version tag; execution admits only exact bytes.
          image="public.ecr.aws/supabase/postgres:17.6.1.095"
          expected="sha256:35ebf7c6d3b77a430146b0a91974ed1fc14432b5741db4a3e41cd5f899b17f1a"
          docker pull --platform=linux/arm64 "$image"
          test "$(docker image inspect "$image" --format '{{.Id}}')" = "$expected"

      - name: Run canonical current ordinary SQL and recovery acceptance
        run: |
          set -euo pipefail
          docker_path="$(python3 -c 'import os,shutil;print(os.path.realpath(shutil.which("docker")))')"
          docker_pin="$(sha256sum "$docker_path" | cut -d ' ' -f 1)"
          fixture_pin="$(sha256sum scripts/tests/fixtures/ordinary_installer_v1/manifest.json | cut -d ' ' -f 1)"
          python3 -B scripts/qa/run_sql_ci.py \
            --docker "$docker_path" --docker-sha256 "$docker_pin" \
            --docker-host unix:///var/run/docker.sock \
            --fixture-lock-sha256 "$fixture_pin" --recovery-roundtrip --output .cache/sql-ci

      - name: Preserve completed and failed ordinary SQL evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ordinary-sql-evidence
          path: .cache/sql-ci
          include-hidden-files: true
          retention-days: 14

  ruby-delivery-tools:
    name: Frozen Ruby delivery dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Check frozen bundle and actual ZIP boundary
        run: |
          bundle check
          bundle exec ruby scripts/tests/ruby_dependency_security_test.rb
          bundle exec fastlane lanes

  notification-operator:
    name: Notification operator checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/collect-notification-mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Install pinned package manager
        run: npm install --global pnpm@10.33.2 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - run: pnpm test

  cover-catalog:
    name: Generated cover catalog tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - run: make cover-catalog-test

  # ── 6. M-Money SMS contract lane (fast ~2min) ──────────────────────
  momo-sms-contracts:
    name: M-Money SMS Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read pinned Flutter version
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open(".fvmrc", "r", encoding="utf-8") as handle:
              config = json.load(handle)

          print(f"version={config['flutter']}")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version-file: .dvmrc
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Run M-Money SMS contract checks
        run: bash scripts/qa/check_momo_sms_contracts.sh

  # ── 7. APK size gate (slow ~5min, depends on analyze) ──────────────
  apk-size:
    name: APK size check
    runs-on: ubuntu-latest
    needs: [analyze]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Read pinned Flutter version
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open(".fvmrc", "r", encoding="utf-8") as handle:
              config = json.load(handle)

          print(f"version={config['flutter']}")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Build release APK size proxy (dev flavor)
        run: flutter build apk --release --split-per-abi --no-pub --flavor dev --dart-define=FLAVOR=dev

      - name: Check per-device APK size budget
        run: |
          shopt -s nullglob
          APK_PATHS=(build/app/outputs/flutter-apk/app-*-dev-release.apk)
          if [ "${#APK_PATHS[@]}" -ne 3 ]; then
            echo "::error::Expected 3 split APKs, found ${#APK_PATHS[@]}"
            exit 1
          fi

          MAX_SIZE_BYTES=$((50 * 1048576))
          for APK_PATH in "${APK_PATHS[@]}"; do
            APK_SIZE_BYTES=$(stat -c%s "$APK_PATH")
            APK_SIZE_MB=$(awk -v bytes="$APK_SIZE_BYTES" 'BEGIN { printf "%.2f", bytes / 1048576 }')
            echo "📦 $(basename "$APK_PATH"): ${APK_SIZE_MB} MB"
            echo "- $(basename "$APK_PATH"): ${APK_SIZE_MB} MB" >> "$GITHUB_STEP_SUMMARY"
            if [ "$APK_SIZE_BYTES" -gt "$MAX_SIZE_BYTES" ]; then
              echo "::error::$(basename "$APK_PATH") (${APK_SIZE_MB} MB) exceeds the 50 MB per-device budget"
              exit 1
            fi
          done

          echo "✅ All split APKs are within the 50 MB per-device budget"

  cloudflare-backend:
    name: Cloudflare account and operating services
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/admin-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: deploy/admin-api/package-lock.json
      - name: Install locked backend test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check Worker syntax
        run: npm run check
      - name: Verify canonical Admin source, artifact and release boundaries
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m unittest scripts.tests.test_admin_cloudflare_source scripts.tests.test_admin_cloudflare_artifact scripts.tests.test_admin_cloudflare_assets scripts.tests.test_admin_cloudflare_preflight scripts.tests.test_admin_cloudflare_shell -v
          node --test scripts/tests/admin_cloudflare_retirement_worker_test.mjs scripts/tests/admin_cloudflare_shell_worker_test.mjs
      - name: Verify accounts, permissions, operations and email with local workerd and D1
        # Email bindings are in-memory fixtures. No provider credentials or
        # hosted database are supplied to this job.
        run: npm test
