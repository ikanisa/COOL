name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ── Shared setup anchor ───────────────────────────────────────────────
# Re-used across parallel jobs via composite actions isn't needed here;
# each job declares its own setup for clarity and cache independence.

jobs:
  # ── 0. Repo hygiene (fast ~10s) ────────────────────────────────────
  repo-hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Secret & binary file scan
        run: |
          BLOCKED_PATTERNS='\.jks$|\.keystore$|\.bak$|\.old$|\.orig$|sa-key.*\.json$'
          ALLOW_LIST='\.gitignore$|\.env\.example$'
          MATCHES=$(git ls-files | grep -E "$BLOCKED_PATTERNS" | grep -vE "$ALLOW_LIST" || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Tracked files match blocked patterns:"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ No blocked secret/binary files tracked"

      - name: Release secret scan
        run: make release-secret-scan

      - name: Source integrity
        run: make source-integrity

      - name: Sole Revolut design authority
        run: |
          make revolut-design-authority
          python3 scripts/tests/revolut_design_authority_test.py

      - name: Verify asset manifest and Rwanda runtime inventory
        run: |
          ruby scripts/tests/asset_manifest_integrity_test.rb
          ruby scripts/tests/group_runtime_integrity_test.rb
          ruby scripts/qa/group_runtime_integrity.rb --root . --json
          python3 scripts/tests/rwanda_release_scope_test.py

      - name: QA tooling regression tests
        run: make qa-tooling-test

      - name: Coverage gate regression tests
        run: python3 scripts/tests/coverage_gate_test.py

      - name: Patch marker scan
        run: |
          MATCHES=$(git grep -n -E '^\*\*\* (Begin Patch|Add File:|Update File:|Delete File:|Move to:|End Patch)$' -- \
            '.github/workflows/**' \
            'android/**' \
            'ios/**' \
            'lib/**' \
            'scripts/**' \
            'supabase/**' \
            'test/**' \
            'integration_test/**' \
            'tool/**' || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Committed source contains raw patch markers:"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ No raw patch markers found in committed source"

      - name: Supabase migration validation
        run: bash scripts/migrations/validate_supabase_migrations.sh

      - name: Deprecated theme API budget
        run: |
          COUNT=$(grep -rl 'AppColors\|CoolPalette' lib/ 2>/dev/null | wc -l | tr -d ' ')
          BUDGET=8
          echo "📊 Deprecated theme API files: $COUNT (budget: $BUDGET)"
          if [ "$COUNT" -gt "$BUDGET" ]; then
            echo "::error::Deprecated theme API usage ($COUNT files) exceeds budget ($BUDGET). Migrate before merging."
            exit 1
          fi
          echo "✅ Theme API budget OK"

      - name: Large file size check
        run: |
          WARN=500
          FAIL=1200
          EXIT_CODE=0

          while IFS= read -r file; do
            lines=$(wc -l < "$file" | tr -d ' ')
            case "$file" in
              lib/l10n/app_localizations.dart|lib/l10n/app_localizations_*.dart|*.g.dart)
                continue
                ;;
            esac
            if [ "$lines" -gt "$FAIL" ]; then
              echo "::error::$file ($lines lines) exceeds hard limit ($FAIL)"
              EXIT_CODE=1
            elif [ "$lines" -gt "$WARN" ]; then
              echo "::warning::$file ($lines lines) exceeds soft limit ($WARN)"
            fi
          done < <(find lib/ -name '*.dart' -type f 2>/dev/null)

          while IFS= read -r file; do
            lines=$(wc -l < "$file" | tr -d ' ')
            if [ "$lines" -gt "$FAIL" ]; then
              echo "::error::$file ($lines lines) exceeds hard limit ($FAIL)"
              EXIT_CODE=1
            elif [ "$lines" -gt "$WARN" ]; then
              echo "::warning::$file ($lines lines) exceeds soft limit ($WARN)"
            fi
          done < <(find supabase/functions -name '*.ts' -type f 2>/dev/null)

          exit $EXIT_CODE

  # ── 1. Static analysis (fast ~30s) ─────────────────────────────────
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read pinned Flutter version
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open(".fvmrc", "r", encoding="utf-8") as handle:
              config = json.load(handle)

          print(f"version={config['flutter']}")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - run: flutter pub get --enforce-lockfile
      - name: Verify pinned local file_saver fork
        run: python3 scripts/supply_chain/verify_file_saver_fork.py --fetch --check
      - run: make format-check
      - run: flutter analyze --fatal-infos

  # ── 2. Unit Tests (medium ~1.5min) ───────────────────────────────────
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read pinned Flutter version
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open(".fvmrc", "r", encoding="utf-8") as handle:
              config = json.load(handle)

          print(f"version={config['flutter']}")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Run unit + widget tests
        run: flutter test --concurrency=4 --exclude-tags=integration --test-randomize-ordering-seed=random --file-reporter json:test-results.json --coverage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-results
          path: test-results.json
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 14

      - name: Coverage threshold gate
        run: |
          ruby scripts/qa/lcov_coverage.rb coverage/lcov.info 40
          python3 scripts/qa/coverage_gate.py coverage/lcov.info --threshold 40

  # ── 2b. Admin web source compilation (all branches) ────────────────
  admin-web-build:
    name: Admin Web Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [analyze]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read pinned Flutter version
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open(".fvmrc", "r", encoding="utf-8") as handle:
              config = json.load(handle)

          print(f"version={config['flutter']}")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Compile Admin web source without production config
        run: |
          echo '### Admin source compilation only; production PWA checks run in admin-pwa-candidate on main.' >> "$GITHUB_STEP_SUMMARY"
          flutter build web -t lib/main_admin.dart --release --no-pub --dart-define=COLLECT_PUBLIC_LANDING_HOME=false

      - name: Install reviewed Admin security headers
        run: python3 scripts/hardening/admin_headers.py build/web --apply

  # A production-configured candidate can only be built from the main ref.
  # The compile-only job above is not a release artifact or PWA gate.
  admin-pwa-candidate:
    name: Admin PWA Candidate Build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [repo-hygiene, analyze]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read pinned Flutter version
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open('.fvmrc', encoding='utf-8') as handle:
              config = json.load(handle)
          print(f"version={config['flutter']}")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Build and verify Admin PWA candidate
        env:
          FLUTTER: flutter
          COLLECT_SKIP_DOTENV: '1'
          SUPABASE_PRODUCTION_URL: ${{ secrets.SUPABASE_PRODUCTION_URL }}
          SUPABASE_PRODUCTION_ANON_KEY: ${{ secrets.SUPABASE_PRODUCTION_ANON_KEY }}
          APP_PUBLIC_URL: https://collect.ikanisa.com
          ADMIN_APP_URL: https://admin.collect.ikanisa.com
        run: bash scripts/admin_pwa_release_build.sh

      - name: Bind candidate to clean source commit
        run: |
          python3 - <<'PY'
          import json
          import os

          with open('build/web/version.json', encoding='utf-8') as handle:
              version = json.load(handle)
          if version.get('source_commit') != os.environ['GITHUB_SHA'] or version.get('source_dirty') is not False:
              raise SystemExit('Admin PWA candidate does not match the clean workflow commit')
          PY
          find build/web -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > build/admin-web.sha256

      - name: Retain Admin PWA candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: admin-pwa-candidate
          path: |
            build/web/
            build/admin-web.sha256
          retention-days: 14
          if-no-files-found: error

  # ── 3. Fixture journey smoke (native device UAT runs separately) ────
  integration-test:
    name: Member and Admin journey smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read pinned Flutter version
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open(".fvmrc", "r", encoding="utf-8") as handle:
              config = json.load(handle)

          print(f"version={config['flutter']}")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Run member and Admin fixture journeys
        run: >-
          flutter test --no-pub --concurrency=4
          test/persona_uat_smoke_test.dart
          test/features/auth_error_recovery_test.dart
          test/features/mobile_review_navigation_test.dart
          test/admin_login_recovery_test.dart
          test/admin_data_sync_test.dart
          test/admin_list_models_test.dart
          test/admin_list_paging_test.dart
          test/admin_repository_paging_test.dart
          --file-reporter json:test-results.json

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-test-results
          path: test-results.json
          retention-days: 14

  # ── 4. Governance docs + deep-link checks (fast ~15s) ──────────────
  docs-check:
    name: Docs sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate notification and deep-link routing
        run: bash scripts/notification_readiness_gate.sh

      - name: Build and validate public deep-link assets
        run: bash scripts/public_website_ci_gate.sh static

  # ── 5. Deno checks (fast ~15s) ─────────────────────────────────────
  deno-check:
    name: Deno (edge functions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version-file: .dvmrc
          cache: true

      - name: Run edge function tests
        run: |
          deno_tests=()
          while IFS= read -r file; do
            deno_tests+=("$file")
          done < <(find supabase/functions -type f -name '*_test.ts' | sort)

          if [ "${#deno_tests[@]}" -eq 0 ]; then
            echo "::error::No Deno test files found under supabase/functions."
            exit 1
          fi

          deno test --allow-env=SUPABASE_SERVICE_ROLE_KEY,AUTH_PHONE_PASSWORD_SECRET,OTP_CODE_HASH_SECRET,OTP_TEST_PHONE,OTP_TEST_CODE,GOOGLE_SERVICE_ACCOUNT_EMAIL,GOOGLE_PRIVATE_KEY,AI_AUDIT_SHEET_ID "${deno_tests[@]}"

      - name: Type-check edge functions
        run: |
          deno_files=()
          while IFS= read -r file; do
            deno_files+=("$file")
          done < <(find supabase/functions -type f -name '*.ts' | sort)
          deno check "${deno_files[@]}"

      - name: Exercise Edge HTTP authorization with isolated dependencies
        run: make edge-http-test EDGE_HTTP_EVIDENCE=.cache/edge-http-ci

      - name: Preserve Edge HTTP evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: edge-http-evidence
          path: .cache/edge-http-ci
          include-hidden-files: true
          retention-days: 14

  notification-operator:
    name: Notification operator checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/collect-notification-mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Install pinned package manager
        run: npm install --global pnpm@10.33.2 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - run: pnpm test

  cover-catalog:
    name: Generated cover catalog tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - run: make cover-catalog-test

  # ── 6. M-Money SMS contract lane (fast ~2min) ──────────────────────
  momo-sms-contracts:
    name: M-Money SMS Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read pinned Flutter version
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open(".fvmrc", "r", encoding="utf-8") as handle:
              config = json.load(handle)

          print(f"version={config['flutter']}")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version-file: .dvmrc
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Run M-Money SMS contract checks
        run: bash scripts/qa/check_momo_sms_contracts.sh

  # ── 7. APK size gate (slow ~5min, depends on analyze) ──────────────
  apk-size:
    name: APK size check
    runs-on: ubuntu-latest
    needs: [analyze]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Read pinned Flutter version
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open(".fvmrc", "r", encoding="utf-8") as handle:
              config = json.load(handle)

          print(f"version={config['flutter']}")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Build release APK size proxy (dev flavor)
        run: flutter build apk --release --split-per-abi --no-pub --flavor dev --dart-define=FLAVOR=dev

      - name: Check per-device APK size budget
        run: |
          shopt -s nullglob
          APK_PATHS=(build/app/outputs/flutter-apk/app-*-dev-release.apk)
          if [ "${#APK_PATHS[@]}" -ne 3 ]; then
            echo "::error::Expected 3 split APKs, found ${#APK_PATHS[@]}"
            exit 1
          fi

          MAX_SIZE_BYTES=$((50 * 1048576))
          for APK_PATH in "${APK_PATHS[@]}"; do
            APK_SIZE_BYTES=$(stat -c%s "$APK_PATH")
            APK_SIZE_MB=$(awk -v bytes="$APK_SIZE_BYTES" 'BEGIN { printf "%.2f", bytes / 1048576 }')
            echo "📦 $(basename "$APK_PATH"): ${APK_SIZE_MB} MB"
            echo "- $(basename "$APK_PATH"): ${APK_SIZE_MB} MB" >> "$GITHUB_STEP_SUMMARY"
            if [ "$APK_SIZE_BYTES" -gt "$MAX_SIZE_BYTES" ]; then
              echo "::error::$(basename "$APK_PATH") (${APK_SIZE_MB} MB) exceeds the 50 MB per-device budget"
              exit 1
            fi
          done

          echo "✅ All split APKs are within the 50 MB per-device budget"
