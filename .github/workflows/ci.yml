name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ── Shared setup anchor ───────────────────────────────────────────────
# Re-used across parallel jobs via composite actions isn't needed here;
# each job declares its own setup for clarity and cache independence.

jobs:
  # ── 0. Repo hygiene (fast ~10s) ────────────────────────────────────
  repo-hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Secret & binary file scan
        run: |
          BLOCKED_PATTERNS='\.jks$|\.keystore$|\.bak$|\.old$|\.orig$|sa-key.*\.json$'
          ALLOW_LIST='\.gitignore$|\.env\.example$'
          MATCHES=$(git ls-files | grep -E "$BLOCKED_PATTERNS" | grep -vE "$ALLOW_LIST" || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Tracked files match blocked patterns:"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ No blocked secret/binary files tracked"

      - name: Release secret scan
        run: make release-secret-scan

      - name: Revolut parity source hygiene
        run: make revolut-parity-source-hygiene

      - name: Revolut parity evidence consistency
        run: make revolut-parity-evidence-consistency

      - name: Patch marker scan
        run: |
          MATCHES=$(git grep -n -E '^\*\*\* (Begin Patch|Add File:|Update File:|Delete File:|Move to:|End Patch)$' -- \
            '.github/workflows/**' \
            'android/**' \
            'ios/**' \
            'lib/**' \
            'scripts/**' \
            'supabase/**' \
            'test/**' \
            'integration_test/**' \
            'tool/**' || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Committed source contains raw patch markers:"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ No raw patch markers found in committed source"

      - name: Supabase migration validation
        run: bash scripts/migrations/validate_supabase_migrations.sh

      - name: Deprecated theme API budget
        run: |
          COUNT=$(grep -rl 'AppColors\|CoolPalette' lib/ 2>/dev/null | wc -l | tr -d ' ')
          BUDGET=8
          echo "📊 Deprecated theme API files: $COUNT (budget: $BUDGET)"
          if [ "$COUNT" -gt "$BUDGET" ]; then
            echo "::error::Deprecated theme API usage ($COUNT files) exceeds budget ($BUDGET). Migrate before merging."
            exit 1
          fi
          echo "✅ Theme API budget OK"

      - name: Large file size check
        run: |
          WARN=500
          FAIL=1200
          EXIT_CODE=0

          while IFS= read -r file; do
            lines=$(wc -l < "$file" | tr -d ' ')
            case "$file" in
              lib/l10n/app_localizations.dart|lib/l10n/app_localizations_*.dart|*.g.dart)
                continue
                ;;
            esac
            if [ "$lines" -gt "$FAIL" ]; then
              echo "::error::$file ($lines lines) exceeds hard limit ($FAIL)"
              EXIT_CODE=1
            elif [ "$lines" -gt "$WARN" ]; then
              echo "::warning::$file ($lines lines) exceeds soft limit ($WARN)"
            fi
          done < <(find lib/ -name '*.dart' -type f 2>/dev/null)

          while IFS= read -r file; do
            lines=$(wc -l < "$file" | tr -d ' ')
            if [ "$lines" -gt "$FAIL" ]; then
              echo "::error::$file ($lines lines) exceeds hard limit ($FAIL)"
              EXIT_CODE=1
            elif [ "$lines" -gt "$WARN" ]; then
              echo "::warning::$file ($lines lines) exceeds soft limit ($WARN)"
            fi
          done < <(find supabase/functions -name '*.ts' -type f 2>/dev/null)

          exit $EXIT_CODE

  # ── 1. Static analysis (fast ~30s) ─────────────────────────────────
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read pinned Flutter version
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open(".fvmrc", "r", encoding="utf-8") as handle:
              config = json.load(handle)

          print(f"version={config['flutter']}")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - run: flutter pub get
      - run: flutter analyze --fatal-infos

  # ── 2. Unit Tests (medium ~1.5min) ───────────────────────────────────
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read pinned Flutter version
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open(".fvmrc", "r", encoding="utf-8") as handle:
              config = json.load(handle)

          print(f"version={config['flutter']}")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - run: flutter pub get

      - name: Run unit + widget tests
        run: flutter test --concurrency=4 --exclude-tags=integration --test-randomize-ordering-seed=random --file-reporter json:test-results.json --coverage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-results
          path: test-results.json
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 14

      - name: Coverage threshold gate
        run: |
          THRESHOLD=40
          if [ ! -f coverage/lcov.info ]; then
            echo "::warning::No coverage report found — skipping threshold check"
            exit 0
          fi

          # Parse lcov.info for line coverage
          LINES_FOUND=$(grep -c '^DA:' coverage/lcov.info || echo 0)
          LINES_HIT=$(grep '^DA:' coverage/lcov.info | awk -F, '{s+=$2} END {print s+0}' || echo 0)
          LINES_TOTAL=$(grep '^DA:' coverage/lcov.info | awk -F, '{s+=1} END {print s+0}' || echo 0)

          if [ "$LINES_TOTAL" -eq 0 ]; then
            echo "::warning::No coverage data lines found"
            exit 0
          fi

          COVERAGE=$(( LINES_HIT * 100 / LINES_TOTAL ))
          echo "📊 Line coverage: ${COVERAGE}% (${LINES_HIT}/${LINES_TOTAL} lines)"
          echo "### 📊 Coverage: ${COVERAGE}% (threshold: ${THRESHOLD}%)" >> "$GITHUB_STEP_SUMMARY"

          if [ "$COVERAGE" -lt "$THRESHOLD" ]; then
            echo "::error::Line coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi

          echo "✅ Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"

  # ── 2b. Admin web production build ─────────────────────────────────
  admin-web-build:
    name: Admin Web Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [analyze]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read pinned Flutter version
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open(".fvmrc", "r", encoding="utf-8") as handle:
              config = json.load(handle)

          print(f"version={config['flutter']}")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - run: flutter pub get

      - name: Build admin web
        run: flutter build web -t lib/main_admin.dart --release --no-pub

  # ── 3. Integration Tests (medium ~1.5min) ────────────────────────────
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read pinned Flutter version
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open(".fvmrc", "r", encoding="utf-8") as handle:
              config = json.load(handle)

          print(f"version={config['flutter']}")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - run: flutter pub get

      - name: Run integration smoke tests
        run: flutter test --concurrency=4 test/integration_smoke --file-reporter json:test-results.json

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-results
          path: test-results.json
          retention-days: 14

  # ── 4. Governance docs + deep-link checks (fast ~15s) ──────────────
  docs-check:
    name: Docs sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate the universal governance contract
        run: make universal-contract-gate

      - name: Validate notification and deep-link routing
        run: bash scripts/notification_readiness_gate.sh

      - name: Build and validate public deep-link assets
        run: bash scripts/public_website_ci_gate.sh static

  # ── 5. Deno checks (fast ~15s) ─────────────────────────────────────
  deno-check:
    name: Deno (edge functions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version-file: .dvmrc
          cache: true

      - name: Run edge function tests
        run: |
          deno_tests=()
          while IFS= read -r file; do
            deno_tests+=("$file")
          done < <(find supabase/functions -type f -name '*_test.ts' | sort)

          if [ "${#deno_tests[@]}" -eq 0 ]; then
            echo "::error::No Deno test files found under supabase/functions."
            exit 1
          fi

          deno test --allow-env=SUPABASE_SERVICE_ROLE_KEY,AUTH_PHONE_PASSWORD_SECRET,OTP_CODE_HASH_SECRET,OTP_TEST_PHONE,OTP_TEST_CODE,GOOGLE_SERVICE_ACCOUNT_EMAIL,GOOGLE_PRIVATE_KEY,AI_AUDIT_SHEET_ID "${deno_tests[@]}"

      - name: Type-check edge functions
        run: |
          deno_files=()
          while IFS= read -r file; do
            deno_files+=("$file")
          done < <(find supabase/functions -type f -name '*.ts' | sort)
          deno check "${deno_files[@]}"

  # ── 6. M-Money SMS contract lane (fast ~2min) ──────────────────────
  momo-sms-contracts:
    name: M-Money SMS Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read pinned Flutter version
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open(".fvmrc", "r", encoding="utf-8") as handle:
              config = json.load(handle)

          print(f"version={config['flutter']}")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version-file: .dvmrc
          cache: true

      - run: flutter pub get

      - name: Run M-Money SMS contract checks
        run: bash scripts/qa/check_momo_sms_contracts.sh

  # ── 7. APK size gate (slow ~5min, depends on analyze) ──────────────
  apk-size:
    name: APK size check
    runs-on: ubuntu-latest
    needs: [analyze]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Read pinned Flutter version
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open(".fvmrc", "r", encoding="utf-8") as handle:
              config = json.load(handle)

          print(f"version={config['flutter']}")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - run: flutter pub get

      - name: Build release APK size proxy (dev flavor)
        run: flutter build apk --release --split-per-abi --no-pub --flavor dev --dart-define=FLAVOR=dev

      - name: Check per-device APK size budget
        run: |
          shopt -s nullglob
          APK_PATHS=(build/app/outputs/flutter-apk/app-*-dev-release.apk)
          if [ "${#APK_PATHS[@]}" -ne 3 ]; then
            echo "::error::Expected 3 split APKs, found ${#APK_PATHS[@]}"
            exit 1
          fi

          MAX_SIZE_BYTES=$((50 * 1048576))
          for APK_PATH in "${APK_PATHS[@]}"; do
            APK_SIZE_BYTES=$(stat -c%s "$APK_PATH")
            APK_SIZE_MB=$(awk -v bytes="$APK_SIZE_BYTES" 'BEGIN { printf "%.2f", bytes / 1048576 }')
            echo "📦 $(basename "$APK_PATH"): ${APK_SIZE_MB} MB"
            echo "- $(basename "$APK_PATH"): ${APK_SIZE_MB} MB" >> "$GITHUB_STEP_SUMMARY"
            if [ "$APK_SIZE_BYTES" -gt "$MAX_SIZE_BYTES" ]; then
              echo "::error::$(basename "$APK_PATH") (${APK_SIZE_MB} MB) exceeds the 50 MB per-device budget"
              exit 1
            fi
          done

          echo "✅ All split APKs are within the 50 MB per-device budget"
