name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Read pinned Flutter version
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open(".fvmrc", "r", encoding="utf-8") as handle:
              config = json.load(handle)

          print(f"version={config['flutter']}")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run release readiness checks
        run: bash scripts/release_readiness.sh

      # ── APK Size Gate ───────────────────────────────────────
      - name: Build release APK (size check)
        run: flutter build apk --release --no-pub

      - name: Check APK size budget
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK not found at $APK_PATH"
            exit 1
          fi

          APK_SIZE_BYTES=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
          APK_SIZE_MB=$(echo "scale=2; $APK_SIZE_BYTES / 1048576" | bc)

          echo "📦 APK size: ${APK_SIZE_MB} MB"
          echo "### 📦 APK Size: ${APK_SIZE_MB} MB" >> "$GITHUB_STEP_SUMMARY"

          MAX_SIZE_BYTES=$((50 * 1048576))
          if [ "$APK_SIZE_BYTES" -gt "$MAX_SIZE_BYTES" ]; then
            echo "::error::APK size (${APK_SIZE_MB} MB) exceeds budget (50 MB)"
            exit 1
          fi

          echo "✅ APK size within budget (< 50 MB)"
