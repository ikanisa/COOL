  # ── 7. APK size gate (slow ~5min, depends on analyze) ──────────────
  apk-size:
    name: APK size check
    runs-on: ubuntu-latest
    needs: [analyze]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Read pinned Flutter version
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open(".fvmrc", "r", encoding="utf-8") as handle:
              config = json.load(handle)

          print(f"version={config['flutter']}")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Build release APK size proxy (dev flavor)
        env:
          COLLECT_BACKEND: supabase
          SUPABASE_URL: https://rrlduytparvsjfmegalh.supabase.co
          SUPABASE_API_URL: https://platform-admin.collect.ikanisa.com
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.COLLECT_SUPABASE_PUBLISHABLE_KEY }}
          AUTH_CAPTCHA_ENABLED: 'true'
          AUTH_CAPTCHA_PROVIDER: turnstile
          AUTH_CAPTCHA_SITE_KEY: ${{ vars.COLLECT_AUTH_CAPTCHA_SITE_KEY }}
          GOOGLE_AUTH_ENABLED: ${{ vars.COLLECT_GOOGLE_AUTH_ENABLED || 'false' }}
        run: |
          set -euo pipefail
          umask 077
          PUBLIC_CONFIG="$(mktemp "$RUNNER_TEMP/collect-apk-size-defines.XXXXXX.json")"
          trap 'rm -f "$PUBLIC_CONFIG"' EXIT
          python3 scripts/qa/native_build_config.py android --defines-output "$PUBLIC_CONFIG"
          flutter build apk --release --split-per-abi --no-pub --flavor dev --dart-define=FLAVOR=dev --dart-define-from-file="$PUBLIC_CONFIG"

      - name: Check per-device APK size budget
        run: |
          shopt -s nullglob
          APK_PATHS=(build/app/outputs/flutter-apk/app-*-dev-release.apk)
          if [ "${#APK_PATHS[@]}" -ne 3 ]; then
            echo "::error::Expected 3 split APKs, found ${#APK_PATHS[@]}"
            exit 1
          fi

          MAX_SIZE_BYTES=$((50 * 1048576))
          for APK_PATH in "${APK_PATHS[@]}"; do
            APK_SIZE_BYTES=$(stat -c%s "$APK_PATH")
            APK_SIZE_MB=$(awk -v bytes="$APK_SIZE_BYTES" 'BEGIN { printf "%.2f", bytes / 1048576 }')
            echo "📦 $(basename "$APK_PATH"): ${APK_SIZE_MB} MB"
            echo "- $(basename "$APK_PATH"): ${APK_SIZE_MB} MB" >> "$GITHUB_STEP_SUMMARY"
            if [ "$APK_SIZE_BYTES" -gt "$MAX_SIZE_BYTES" ]; then
              echo "::error::$(basename "$APK_PATH") (${APK_SIZE_MB} MB) exceeds the 50 MB per-device budget"
              exit 1
            fi
          done

          echo "✅ All split APKs are within the 50 MB per-device budget"

