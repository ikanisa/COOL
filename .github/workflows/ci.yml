name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ── Shared setup anchor ───────────────────────────────────────────────
# Re-used across parallel jobs via composite actions isn't needed here;
# each job declares its own setup for clarity and cache independence.

jobs:
  # ── 0. Repo hygiene (fast ~10s) ────────────────────────────────────
  repo-hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Secret & binary file scan
        run: |
          BLOCKED_PATTERNS='\.jks$|\.keystore$|\.bak$|\.old$|\.orig$|sa-key.*\.json$'
          ALLOW_LIST='\.gitignore$|\.env\.example$'
          MATCHES=$(git ls-files | grep -E "$BLOCKED_PATTERNS" | grep -vE "$ALLOW_LIST" || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Tracked files match blocked patterns:"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ No blocked secret/binary files tracked"

      - name: Deprecated theme API budget
        run: |
          COUNT=$(grep -rl 'AppColors\|CoolPalette' lib/ 2>/dev/null | wc -l | tr -d ' ')
          BUDGET=30
          echo "📊 Deprecated theme API files: $COUNT (budget: $BUDGET)"
          if [ "$COUNT" -gt "$BUDGET" ]; then
            echo "::error::Deprecated theme API usage ($COUNT files) exceeds budget ($BUDGET). Migrate before merging."
            exit 1
          fi
          echo "✅ Theme API budget OK"

      - name: Large file size check
        run: |
          WARN=800
          FAIL=1200
          # Waiver list: files explicitly allowed to exceed limits
          WAIVER_LIST=""
          EXIT_CODE=0

          while IFS= read -r file; do
            lines=$(wc -l < "$file" | tr -d ' ')
            if echo "$WAIVER_LIST" | grep -qF "$file"; then
              continue
            fi
            if [ "$lines" -gt "$FAIL" ]; then
              echo "::error::$file ($lines lines) exceeds hard limit ($FAIL)"
              EXIT_CODE=1
            elif [ "$lines" -gt "$WARN" ]; then
              echo "::warning::$file ($lines lines) exceeds soft limit ($WARN)"
            fi
          done < <(find lib/ -name '*.dart' -type f 2>/dev/null)

          while IFS= read -r file; do
            lines=$(wc -l < "$file" | tr -d ' ')
            if [ "$lines" -gt "$FAIL" ]; then
              echo "::error::$file ($lines lines) exceeds hard limit ($FAIL)"
              EXIT_CODE=1
            elif [ "$lines" -gt "$WARN" ]; then
              echo "::warning::$file ($lines lines) exceeds soft limit ($WARN)"
            fi
          done < <(find supabase/functions -name '*.ts' -type f 2>/dev/null)

          exit $EXIT_CODE

  # ── 1. Static analysis (fast ~30s) ─────────────────────────────────
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Flutter version
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open(".fvmrc", "r", encoding="utf-8") as handle:
              config = json.load(handle)

          print(f"version={config['flutter']}")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - run: flutter pub get
      - run: flutter analyze --fatal-infos

  # ── 2. Unit Tests (medium ~1.5min) ───────────────────────────────────
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Flutter version
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open(".fvmrc", "r", encoding="utf-8") as handle:
              config = json.load(handle)

          print(f"version={config['flutter']}")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - run: flutter pub get

      - name: Run unit + widget tests
        run: flutter test --concurrency=4 --exclude-tags=integration --file-reporter json:test-results.json --coverage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results.json
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 14

  # ── 3. Integration Tests (medium ~1.5min) ────────────────────────────
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Flutter version
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open(".fvmrc", "r", encoding="utf-8") as handle:
              config = json.load(handle)

          print(f"version={config['flutter']}")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - run: flutter pub get

      - name: Run integration smoke tests
        run: flutter test --concurrency=4 test/integration_smoke

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: test-results.json
          retention-days: 14

  # ── 4. Governance docs + deep-link checks (fast ~15s) ──────────────
  docs-check:
    name: Docs sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Flutter version
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open(".fvmrc", "r", encoding="utf-8") as handle:
              config = json.load(handle)

          print(f"version={config['flutter']}")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - run: flutter pub get
      - name: Run governance docs check
        run: |
          dart tool/governance_docs.dart --check || {
            echo "::error::Governance docs check failed. Please run 'dart tool/governance_docs.dart --generate' locally and commit the changes."
            echo "### ❌ Governance Docs Check Failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
      - name: Run deep link release assets check
        run: |
          dart tool/deep_link_release_assets.dart --generate --check || {
            echo "::error::Deep link release assets check failed. Please run 'dart tool/deep_link_release_assets.dart --generate' locally and commit the changes."
            echo "### ❌ Deep Link Release Assets Check Failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

  # ── 5. Deno checks (fast ~15s) ─────────────────────────────────────
  deno-check:
    name: Deno (edge functions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc
          cache: true

      - name: Run edge function tests
        run: |
          deno test \
            supabase/functions/parse-momo-sms/ai_parser_test.ts \
            supabase/functions/parse-momo-sms/rayon_confirmation_test.ts

      - name: Type-check edge functions
        run: |
          deno_files=()
          while IFS= read -r file; do
            deno_files+=("$file")
          done < <(find supabase/functions -type f -name '*.ts' | sort)
          deno check "${deno_files[@]}"

  # ── 6. M-Money SMS contract lane (fast ~2min) ──────────────────────
  momo-sms-contracts:
    name: M-Money SMS Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Flutter version
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open(".fvmrc", "r", encoding="utf-8") as handle:
              config = json.load(handle)

          print(f"version={config['flutter']}")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc
          cache: true

      - run: flutter pub get

      - name: Run M-Money SMS contract checks
        run: bash scripts/check_momo_sms_contracts.sh

  # ── 7. APK size gate (slow ~5min, depends on analyze) ──────────────
  apk-size:
    name: APK size check
    runs-on: ubuntu-latest
    needs: [analyze]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Read pinned Flutter version
        id: flutter-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open(".fvmrc", "r", encoding="utf-8") as handle:
              config = json.load(handle)

          print(f"version={config['flutter']}")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - run: flutter pub get

      - name: Build release APK (size check)
        run: flutter build apk --release --no-pub --flavor production --dart-define=FLAVOR=production

      - name: Check APK size budget
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-production-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK not found at $APK_PATH"
            exit 1
          fi

          APK_SIZE_BYTES=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
          APK_SIZE_MB=$(echo "scale=2; $APK_SIZE_BYTES / 1048576" | bc)

          echo "📦 APK size: ${APK_SIZE_MB} MB"
          echo "### 📦 APK Size: ${APK_SIZE_MB} MB" >> "$GITHUB_STEP_SUMMARY"

          MAX_SIZE_BYTES=$((50 * 1048576))
          if [ "$APK_SIZE_BYTES" -gt "$MAX_SIZE_BYTES" ]; then
            echo "::error::APK size (${APK_SIZE_MB} MB) exceeds budget (50 MB)"
            exit 1
          fi

          echo "✅ APK size within budget (< 50 MB)"
