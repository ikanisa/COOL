  android-signing-policy:
    name: Existing protected Android signing environment
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.android_signed_candidate && github.ref == 'refs/heads/main' }}
    # Do not name an environment here: GitHub must not auto-create an absent
    # signing environment before the read-only policy check has passed.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      COLLECT_ANDROID_EXPECTED_COMMIT: ${{ inputs.android_expected_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.android_expected_commit }}
          persist-credentials: false
      - name: Read existing signing environment policy without signing inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/qa/android_signed_candidate.py policy

  android-signed-candidate:
    name: Reviewed signed Android candidate without publication
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.android_signed_candidate && github.ref == 'refs/heads/main' }}
    needs: [analyze, android-signing-policy]
    environment: collect-android-signing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      COLLECT_ANDROID_EXPECTED_COMMIT: ${{ inputs.android_expected_commit }}
      COLLECT_ANDROID_SOURCE_SHA256: ${{ inputs.android_source_sha256 }}
      COLLECT_ANDROID_APPROVAL_SHA256: ${{ inputs.android_approval_sha256 }}
      REVIEWED_ANDROID_APPROVAL_RECORD: ${{ inputs.android_approval_record }}
      COLLECT_ANDROID_APPROVED_UPLOAD_CERT_SHA256: ${{ vars.COLLECT_ANDROID_APPROVED_UPLOAD_CERT_SHA256 }}
      PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER: ${{ vars.COLLECT_PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER }}
      COLLECT_ANDROID_GOOGLE_SERVICES_JSON: ${{ vars.COLLECT_ANDROID_GOOGLE_SERVICES_JSON }}
      COLLECT_BACKEND: supabase
      SUPABASE_URL: https://rrlduytparvsjfmegalh.supabase.co
      SUPABASE_API_URL: https://platform-admin.collect.ikanisa.com
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.COLLECT_SUPABASE_PUBLISHABLE_KEY }}
      AUTH_CAPTCHA_ENABLED: 'true'
      AUTH_CAPTCHA_PROVIDER: turnstile
      AUTH_CAPTCHA_SITE_KEY: ${{ vars.COLLECT_AUTH_CAPTCHA_SITE_KEY }}
      GOOGLE_AUTH_ENABLED: ${{ vars.COLLECT_GOOGLE_AUTH_ENABLED || 'false' }}
      APP_PUBLIC_URL: https://collect.ikanisa.com
      ADMIN_APP_URL: https://platform-admin.collect.ikanisa.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.android_expected_commit }}
          persist-credentials: false
      - name: Require reviewed main dispatch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$COLLECT_ANDROID_EXPECTED_COMMIT"
          test "$GITHUB_REPOSITORY" = ikanisa/COOL
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Read pinned Flutter version
        id: flutter-version
        run: python3 -c 'import json; print("version=" + json.load(open(".fvmrc"))["flutter"])' >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true
      - name: Resolve pinned native dependencies without signing inputs
        run: flutter pub get --enforce-lockfile
      - name: Offline Android candidate boundary checks
        run: python3 -B scripts/tests/android_signed_candidate_test.py
      - name: Verify scoped approval, public profile, policy and exact source before signing inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/qa/android_signed_candidate.py prepare
      - name: Build and inspect signed production candidate
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: python3 -B scripts/qa/android_signed_candidate.py build
      - name: Remove only owned transient signing and provider files
        if: ${{ always() }}
        run: python3 -B scripts/qa/android_signed_candidate.py cleanup
      - name: Retain exact signed candidate and public provenance
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: collect-android-signed-candidate
          path: |
            ${{ runner.temp }}/android-delivery/Collect.aab
            ${{ runner.temp }}/android-delivery/Collect.apk
            ${{ runner.temp }}/android-delivery/inspection.json
            ${{ runner.temp }}/android-delivery/source-manifest.json
            ${{ runner.temp }}/android-delivery/public-profile.json
            ${{ runner.temp }}/android-delivery/build-manifest.json
            ${{ runner.temp }}/android-delivery/native-build.json
            ${{ runner.temp }}/android-delivery/environment-policy.json
          if-no-files-found: error
          retention-days: 14
