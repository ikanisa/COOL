name: BuriMunsi isolated native build and instrumentation
on:
  push:
    paths: ['deploy/platform-admin/src/supabase-transport.js', 'deploy/platform-admin/test/burimunsi-access.test.mjs', 'integration/collect-posting/**', 'supabase/functions/_shared/domain/contribution-posting.mjs', 'supabase/functions/_shared/domain/index.js', 'supabase/functions/_shared/domain/admin_bridge.js', 'supabase/functions/_shared/domain/canonical_people.js', 'supabase/functions/_shared/domain/admin_burimunsi_*.js', 'upstream/collect/**', 'native/burimunsi/**', 'supabase/functions/_shared/domain/burimunsi/**', 'supabase/functions/_shared/tests/burimunsi/**', 'tests/**', 'scripts/**', 'contracts/burimunsi-api/**', 'contracts/ui-copy.json', 'contracts/presentation-state-coverage.json', 'contracts/paged-restoration.json', 'contracts/read-only-recovery-retry.json', 'contracts/uiux-journeys.json', 'release/toolchain.json', '.github/workflows/burimunsi-native.yml']
  pull_request:
    paths: ['deploy/platform-admin/src/supabase-transport.js', 'deploy/platform-admin/test/burimunsi-access.test.mjs', 'integration/collect-posting/**', 'supabase/functions/_shared/domain/contribution-posting.mjs', 'supabase/functions/_shared/domain/index.js', 'supabase/functions/_shared/domain/admin_bridge.js', 'supabase/functions/_shared/domain/canonical_people.js', 'supabase/functions/_shared/domain/admin_burimunsi_*.js', 'upstream/collect/**', 'native/burimunsi/**', 'supabase/functions/_shared/domain/burimunsi/**', 'supabase/functions/_shared/tests/burimunsi/**', 'tests/**', 'scripts/**', 'contracts/burimunsi-api/**', 'contracts/ui-copy.json', 'contracts/presentation-state-coverage.json', 'contracts/paged-restoration.json', 'contracts/read-only-recovery-retry.json', 'contracts/uiux-journeys.json', 'release/toolchain.json', '.github/workflows/burimunsi-native.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: burimunsi-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-build-install-instrument:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify source and host-side gate regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/burimunsi"
          python3 scripts/generate_ui_copy.py --check
          python3 scripts/generate_burimunsi_wire.py --check
          python3 tests/uiux_contract_test.py
          python3 -m unittest discover -s native/burimunsi/pipeline-tests -p '*_test.py' -v 2>&1 | tee "$RUNNER_TEMP/burimunsi/python-tests.log"
          node --test supabase/functions/_shared/tests/burimunsi/*.test.mjs | tee "$RUNNER_TEMP/burimunsi/backend.tap"
          python3 native/burimunsi/scripts/prepare_receiver.py --output "$RUNNER_TEMP/burimunsi/receiver-inputs"
          python3 native/burimunsi/scripts/verify_native_boundary.py | tee "$RUNNER_TEMP/burimunsi/source-gates.json"
      - name: Obtain pinned packages with existing owner licence acceptance
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          python3 native/burimunsi/scripts/setup_native_toolchain.py \
            --execute --output "$RUNNER_TEMP/burimunsi/toolchain"
      - name: Build and inspect Staff and receiving APKs and test APKs
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          python3 native/burimunsi/scripts/native_pipeline.py build \
            --output "$RUNNER_TEMP/burimunsi/build"
      - name: Install and execute all native tests on API 26 and API 36
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          test -e /dev/kvm
          # Ephemeral CI runner only: grant this runner user access, not global chmod 666.
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          bash native/burimunsi/scripts/run_emulator_matrix.sh \
            "$RUNNER_TEMP/burimunsi/build" "$RUNNER_TEMP/burimunsi/devices"
      - name: Preserve build, APK, installation and instrumentation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: burimunsi-native-build-and-instrumentation
          path: |
            ${{ runner.temp }}/burimunsi/
            !${{ runner.temp }}/burimunsi/devices/avds/**
            !${{ runner.temp }}/burimunsi/devices/emulator-home/**
            native/burimunsi/app/build/reports/
            native/burimunsi/core/build/test-results/
          if-no-files-found: error
          retention-days: 14
# No production keys, SDK licence auto-acceptance, backend deployment or live SMS activation.
# API26/36 emulators prove synthetic instrumentation only, not real-carrier reliability.
