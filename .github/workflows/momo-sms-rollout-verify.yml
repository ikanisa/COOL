name: M-Money SMS Rollout Verify

on:
  workflow_dispatch:
  schedule:
    - cron: '40 2 * * *'

permissions:
  contents: read

concurrency:
  group: momo-sms-rollout-verify
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Supabase Rollout
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      TRIGGER_MIGRATION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Skip when database secret is not configured
        if: ${{ env.SUPABASE_DB_URL == '' }}
        run: |
          echo "SUPABASE_DB_URL is not configured. Skipping M-Money SMS rollout verification."

      - name: Install PostgreSQL client
        if: ${{ env.SUPABASE_DB_URL != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run M-Money SMS rollout verifier
        if: ${{ env.SUPABASE_DB_URL != '' }}
        run: bash scripts/qa/verify_momo_sms_supabase_rollout.sh
