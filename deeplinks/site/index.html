<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Open Cool</title>
    <style>
      :root {
        --bg: #0a0a0f;
        --surface: #14141c;
        --border: #232331;
        --text: #f3f4f8;
        --muted: #a2a6b3;
        --accent: #d6ff4f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(214, 255, 79, 0.08), transparent 35%),
          linear-gradient(180deg, #101017 0%, var(--bg) 100%);
        color: var(--text);
        font-family: "DM Sans", system-ui, sans-serif;
      }

      main {
        width: min(92vw, 420px);
        padding: 28px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: rgba(20, 20, 28, 0.92);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 28px;
      }

      p {
        margin: 0;
        line-height: 1.5;
        color: var(--muted);
      }

      .path {
        margin: 18px 0 22px;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.02);
        color: var(--accent);
        font-family: "DM Mono", ui-monospace, monospace;
        font-size: 13px;
        word-break: break-all;
      }

      .actions {
        display: grid;
        gap: 12px;
        margin-top: 22px;
      }

      a.button {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        min-height: 52px;
        padding: 0 18px;
        border-radius: 14px;
        text-decoration: none;
        font-weight: 700;
      }

      a.primary {
        background: var(--accent);
        color: #0a0a0f;
      }

      a.secondary {
        border: 1px solid var(--border);
        color: var(--text);
      }

      .hint {
        margin-top: 14px;
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Open Cool</h1>
      <p id="description">Opening the app. If it is not installed yet, you will be sent to the store.</p>
      <div id="path" class="path">/</div>
      <div class="actions">
        <a id="open-app" class="button primary" href="/">Open in App</a>
        <a id="store-link" class="button secondary" href="/">Get the App</a>
      </div>
      <div class="hint">This page supports direct app opens for routes like <code>/basket</code> and <code>/invite/ABCD1234</code>.</div>
    </main>
    <script src="/assets/store-links.js"></script>
    <script src="/assets/deeplink.js"></script>
  </body>
</html>
