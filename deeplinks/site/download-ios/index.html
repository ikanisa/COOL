<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cool for iPhone</title>
    <style>
      :root {
        --bg: #0a0a0f;
        --surface: #14141c;
        --border: #232331;
        --text: #f3f4f8;
        --muted: #a2a6b3;
        --accent: #d6ff4f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(214, 255, 79, 0.08), transparent 35%),
          linear-gradient(180deg, #101017 0%, var(--bg) 100%);
        color: var(--text);
        font-family: "DM Sans", system-ui, sans-serif;
      }

      main {
        width: min(92vw, 440px);
        padding: 28px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: rgba(20, 20, 28, 0.92);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }

      p {
        margin: 0;
        line-height: 1.6;
        color: var(--muted);
      }

      .actions {
        display: grid;
        gap: 12px;
        margin-top: 24px;
      }

      a.button {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        min-height: 52px;
        padding: 0 18px;
        border-radius: 14px;
        text-decoration: none;
        font-weight: 700;
      }

      a.primary {
        background: var(--accent);
        color: #0a0a0f;
      }

      a.secondary {
        border: 1px solid var(--border);
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Cool for iPhone is not published yet</h1>
      <p>
        The Android app and Android deep links are live. iPhone install and universal-link
        metadata stay disabled until the final Apple bundle, team, and App Store listing are
        ready.
      </p>
      <div class="actions">
        <a class="button primary" href="https://play.google.com/store/apps/details?id=app.cool.mobile">Open Google Play</a>
        <a class="button secondary" href="/">Back to Cool</a>
      </div>
    </main>
  </body>
</html>
