# Public deployment values only. Copy reviewed values to an ignored local file,
# then pass them explicitly with Gradle -P options. Never add an ingestion token,
# staff password, Supabase secret/service-role key, or signing password here.
# Use the EXISTING Collect local Supabase instance via its phone-accessible HTTPS
# origin. The native app and receiver share collect-api, Admin and the same ledger.
collectSupabaseOrigin=
# SAME canonical deployment profile's admin_origin; explicit production value required.
collectAdminOrigin=
burimunsiApiPathPrefix=/functions/v1/collect-api
# Legacy explicit origin overrides must resolve to that same Collect instance.
# Leave them absent to derive both from collectSupabaseOrigin.
collectPublishableKey=
# Server-authorized Collect collection UUID; not a display name or phone number.
burimunsiGroupId=
# Approved receipt corpus/profile identity and explicit timezone offset.
receiptProfileVersion=
receiptUtcOffsetMinutes=

# qualification/nativeTest erase these values and retain the receiving upload hold.
# Production signing and release evidence are configured separately.
