<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="COOL — Community finance, MoMo management, bank workspaces, and secure admin operations in one platform.">
  <meta name="theme-color" content="#0D0A27">

  <!-- Canonical URL -->
  <link rel="canonical" href="https://cool.app/">

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="COOL — Community Finance Platform">
  <meta property="og:description" content="Send money, manage groups, and run secure bank admin operations in one platform.">
  <meta property="og:url" content="https://cool.app/">
  <meta property="og:image" content="https://cool.app/icons/Icon-512.png">
  <meta property="og:site_name" content="COOL">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="COOL — Community Finance Platform">
  <meta name="twitter:description" content="Send money, manage groups, and run secure bank admin operations in one platform.">
  <meta name="twitter:image" content="https://cool.app/icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="COOL">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Preconnect to critical origins -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <title>COOL</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Accessible loading indicator while Flutter boots -->
  <noscript>
    <p style="text-align:center;padding:2rem;font-family:system-ui,sans-serif;">
      This app requires JavaScript to run. Please enable JavaScript in your browser settings.
    </p>
  </noscript>
  <script src="pwa-bridge.js" defer></script>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
