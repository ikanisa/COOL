<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COOL — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #0D0A27;
      color: #F7F9FC;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .offline-card {
      max-width: 380px;
      width: 100%;
      background: #120F2F;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: 32px 28px;
      text-align: center;
    }

    .offline-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      background: rgba(108,99,255,0.12);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .offline-icon svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: #6C63FF;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #F7F9FC;
    }

    p {
      font-size: 14px;
      line-height: 1.5;
      color: #8B8A9E;
      margin-bottom: 24px;
    }

    .retry-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 12px 28px;
      background: #6C63FF;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .retry-btn:hover { background: #8982FF; }
    .retry-btn:active { transform: scale(0.97); }

    @media (prefers-color-scheme: light) {
      body { background: #F4F7FB; color: #0B1220; }
      .offline-card { background: #fff; border-color: rgba(11,18,32,0.1); }
      .offline-icon { background: rgba(0,71,171,0.08); }
      .offline-icon svg { stroke: #0047AB; }
      h1 { color: #0B1220; }
      p { color: #475467; }
      .retry-btn { background: #0047AB; }
      .retry-btn:hover { background: #0C64D9; }
    }
  </style>
</head>
<body>
  <main class="offline-card" role="alert" aria-live="assertive">
    <div class="offline-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <line x1="1" y1="1" x2="23" y2="23"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>
      It looks like your connection dropped. Check your network and try again — your
      data is safe.
    </p>
    <button class="retry-btn" onclick="window.location.reload()">
      Try again
    </button>
  </main>
</body>
</html>
