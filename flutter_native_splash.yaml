flutter_native_splash:
  # Tactile Monolith Layer 0 ("infinite void") — matches app background
  color: "#0D0A27"

  # Logo mark (transparent bg) centered on the dark surface
  image: assets/images/cool_logo_mark_transparent.png

  # Android 12+ splash screen API
  android_12:
    image: assets/images/cool_logo_mark_transparent.png
    icon_background_color: "#0D0A27"
    color: "#0D0A27"

  # Dark mode variants — same, the app is always dark
  color_dark: "#0D0A27"
  image_dark: assets/images/cool_logo_mark_transparent.png

  ios: true
  android: true
