name: cool_app
description: Cool community finance and partner platform.
publish_to: 'none'
version: 1.2.0+5

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Core UI
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  flutter_animate: ^4.5.0


  # State management
  flutter_riverpod: ^2.6.1
  equatable: ^2.0.7

  # Navigation & deep links
  go_router: ^16.3.0
  app_links: ^7.0.0

  # Supabase
  supabase_flutter: ^2.10.2

  # Maps
  google_maps_flutter: ^2.10.0

  # Location & permissions
  geolocator: ^14.0.2
  permission_handler: ^12.0.1

  # QR code
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  google_mlkit_face_detection: ^0.13.2

  # NFC
  flutter_nfc_kit: ^3.4.0
  ndef: ^0.4.0

  # USSD / URL launcher / sharing
  url_launcher: ^6.3.2
  share_plus: ^12.0.1


  # Network
  dio: ^5.8.0

  # Local storage / offline
  hive_flutter: ^1.1.0

  # Firebase
  firebase_core: ^4.5.0
  firebase_analytics: ^12.1.3
  firebase_remote_config: ^6.2.0
  firebase_messaging: ^16.0.0
  firebase_crashlytics: ^5.0.0
  firebase_performance: ^0.11.1+5
  firebase_app_check: ^0.4.1+5

  # Android SMS autoread
  another_telephony: ^0.4.1


  # Formatting
  intl: ^0.20.2
  crypto: ^3.0.7
  image: ^4.5.4
  pdf: ^3.11.3
  syncfusion_flutter_xlsio: ^33.1.45
  file_saver: ^0.3.1
  flutter_contacts: ^2.0.0
  in_app_review: ^2.0.11
  in_app_update: ^4.2.5
  camera: ^0.12.0
  image_picker: ^1.2.0
  path_provider: ^2.1.5
  flutter_svg: ^2.2.4
  no_screenshot: ^1.0.0
  tflite_flutter: ^0.12.1
  uuid: ^4.5.3
  local_auth: ^3.0.1
  flutter_local_notifications: ^21.0.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  shared_preferences: ^2.5.3
  flutter_launcher_icons: ^0.14.4
  yaml: ^3.1.3
  flutter_native_splash: ^2.4.7

dependency_overrides:
  flutter_contacts:
    path: third_party/flutter_contacts

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/partners/
    - assets/icons/
    - assets/fonts/
    - assets/models/biopay/
    - google_fonts/

flutter_launcher_icons:
  android: true
  ios: true
  image_path_ios: assets/images/cool_logo_mark.png
  image_path_android: assets/images/cool_logo_mark.png
