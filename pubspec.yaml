name: cool_app
description: Cool community finance, mobility, and partner platform.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  flutter_animate: ^4.5.0


  # State management
  flutter_riverpod: ^2.6.1
  equatable: ^2.0.7

  # Navigation & deep links
  go_router: ^16.2.1
  app_links: ^6.1.1

  # Supabase
  supabase_flutter: ^2.10.2

  # Maps
  google_maps_flutter: ^2.15.0

  # Location & permissions
  geolocator: ^14.0.2
  permission_handler: ^12.0.1

  # QR code
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0

  # NFC
  flutter_nfc_kit: ^3.4.0
  ndef: ^0.3.1

  # USSD / URL launcher / sharing
  url_launcher: ^6.3.2
  share_plus: ^12.0.1


  # Network
  dio: ^5.8.0

  # Local storage / offline
  hive_flutter: ^1.1.0

  # Firebase
  firebase_core: ^4.5.0
  firebase_analytics: ^12.1.3
  firebase_remote_config: ^6.2.0
  firebase_messaging: ^16.0.0
  firebase_crashlytics: ^5.0.0
  firebase_performance: ^0.11.1+5
  firebase_app_check: ^0.4.1+5
  flutter_native_splash: ^2.4.6



  # Formatting
  intl: ^0.20.2
  crypto: ^3.0.7
  pdf: ^3.11.3
  syncfusion_flutter_xlsio: ^32.2.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path_ios: assets/icons/cool_app_icon.png
  image_path_android: assets/icons/cool_app_icon.png
  adaptive_icon_background: "#0A0A0F"
  adaptive_icon_foreground: assets/icons/cool_app_icon_foreground.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0A0A0F"
  color_dark: "#0A0A0F"
  image: assets/images/cool_logo_mark.png
  image_dark: assets/images/cool_logo_mark.png
  android_12:
    color: "#0A0A0F"
    color_dark: "#0A0A0F"
    image: assets/icons/cool_app_icon_foreground.png
    image_dark: assets/icons/cool_app_icon_foreground.png
