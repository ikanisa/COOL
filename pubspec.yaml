name: collect_app
description: Collect Rwanda community collections app shell.
publish_to: 'none'
version: 1.2.2+10

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.3.0
  crypto: ^3.0.7
  intl: ^0.20.2
  logger: ^2.6.2
  qr_flutter: ^4.1.0
  supabase_flutter: ^2.10.2
  url_launcher: ^6.3.2
  uuid: ^4.5.3
  mobile_scanner: ^7.2.0
  image_picker: ^1.2.2
  share_plus: ^13.1.0
  file_saver: ^0.4.0
  permission_handler: ^12.0.3
  flutter_local_notifications: ^22.0.0
  shared_preferences: ^2.5.5
  country_picker: ^2.0.28

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/collect_runtime/app_icons/app-icon-rule.png
  licenses:
    - assets/typefaces/OFL-Inter.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/typefaces/Inter-Variable.ttf
