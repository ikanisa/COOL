name: collect_app
description: Collect Rwanda community collections app shell.
publish_to: 'none'
version: 1.2.2+10

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.3.0
  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  intl: ^0.20.2
  logger: ^2.6.2
  qr_flutter: ^4.1.0
  supabase_flutter: ^2.10.2
  url_launcher: ^6.3.2
  uuid: ^4.5.3
  mobile_scanner: ^7.2.0
  image_picker: ^1.2.2
  share_plus: ^13.1.0
  file_saver: ^0.3.1
  permission_handler: ^12.0.3
  flutter_local_notifications: ^22.0.0
  shared_preferences: ^2.5.5
  country_picker: ^2.0.28
  flutter_svg: ^2.3.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/collect_app_icon_static.png
    - assets/brand/collect_runtime/
    - assets/brand/collect_runtime/logos/
    - assets/brand/collect_runtime/app_icons/
    - assets/brand/collect_runtime/splash/
    - assets/brand/collect_runtime/icons/
    - assets/brand/collect_runtime/media/
  fonts:
    - family: Collect Runtime
      fonts:
        - asset: assets/fonts/collect/CollectRuntime-Regular.otf
          weight: 400
        - asset: assets/fonts/collect/CollectRuntime-Medium.otf
          weight: 500
        - asset: assets/fonts/collect/CollectRuntime-SemiBold.otf
          weight: 600
        - asset: assets/fonts/collect/CollectRuntime-Bold.otf
          weight: 700
        - asset: assets/fonts/collect/CollectRuntime-ExtraBold.otf
          weight: 800
    - family: Collect Display
      fonts:
        - asset: assets/fonts/collect/CollectDisplay-Regular.otf
          weight: 400
        - asset: assets/fonts/collect/CollectDisplay-Medium.otf
          weight: 500
        - asset: assets/fonts/collect/CollectDisplay-SemiBold.otf
          weight: 600
        - asset: assets/fonts/collect/CollectDisplay-Bold.otf
          weight: 700
        - asset: assets/fonts/collect/CollectDisplay-ExtraBold.otf
          weight: 800
