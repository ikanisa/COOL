name: collect_app
description: Collect Rwanda community collections app shell.
publish_to: 'none'
version: 1.2.4+23

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.3.0
  http: ^1.6.0
  web: ^1.1.1
  app_links: ^7.2.1
  crypto: ^3.0.7
  intl: ^0.20.3
  logger: ^2.6.2
  qr_flutter: ^4.1.0
  supabase_flutter: ^2.10.2
  gotrue: 2.27.1
  url_launcher: ^6.3.2
  uuid: ^4.5.3
  file_picker: ^12.2.0
  mobile_scanner: ^7.2.0
  image_picker: ^1.2.2
  share_plus: ^13.1.0
  # Controlled 0.4.0 fork: Android Gradle source is migrated away from
  # unconditional KGP application for Flutter 3.44+ compatibility.
  file_saver:
    path: third_party/file_saver
  permission_handler: ^12.0.3
  flutter_local_notifications: ^22.0.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  shared_preferences: ^2.5.5
  country_picker: ^2.0.28
  font_awesome_flutter: ^11.0.0
  # Cupertino controls reachable on Apple platforms require the bundled font.
  cupertino_icons: ^1.0.9
  excel: ^4.0.6
  # Roster ZIP bounds and lazy XML validation before spreadsheet decoding.
  archive: 3.6.1
  xml: 6.6.1

dependency_overrides:
  # Pinned native scene callback return contract; unchanged Dart/Android/macOS.
  firebase_messaging:
    path: third_party/firebase_messaging
  # Credential-free browser invalidation; native Auth source behavior retained.
  gotrue:
    path: third_party/gotrue

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/collect_runtime/app_icons/app-icon-rule.png
    - assets/marketing/rwanda/kigali-woman-hero.png
    - assets/marketing/rwanda/community-savings.png
    - assets/marketing/rwanda/banking-together.png
    - assets/marketing/rwanda/kigali-hills.png
    - assets/marketing/rwanda/everyday-payments.png
    - assets/marketing/rwanda/shared-goals.png
    - assets/group_covers/rwanda/covers/
    - assets/group_covers/rwanda/thumbs/
  licenses:
    - assets/typefaces/OFL-Inter.txt
  fonts:
    - family: Aeonik Pro
      fonts:
        - asset: assets/typefaces/AeonikPro-Regular.ttf
          weight: 400
        - asset: assets/typefaces/AeonikPro-Medium.ttf
          weight: 500
    - family: Inter
      fonts:
        - asset: assets/typefaces/Inter-Variable.ttf
